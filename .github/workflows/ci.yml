# CI: lint + test nhanh + test đồ thị + frontend. Cách chạy và cách chạy lại: docs/runbook.md
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  fast:
    name: lint + test nhanh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -m "not graph"

  graph:
    name: test tích hợp (Neo4j + Postgres)
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      # Mật khẩu dùng một lần cho container CI, không phải bí mật. Phải khớp NEO4J_AUTH bên dưới.
      NEO4J_PASSWORD: ci-throwaway-password
      # Như trên: mật khẩu dùng một lần, phải khớp POSTGRES_PASSWORD bên dưới.
      POSTGRES_DSN: postgresql://writory:ci-throwaway-password@localhost:5432/writory
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-throwaway-password
        ports:
          - 7474:7474
          - 7687:7687
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: writory
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: writory
        ports:
          - 5432:5432
        # Runner chỉ chạy bước đầu khi health check đạt.
        options: >-
          --health-cmd "pg_isready -U writory -d writory"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: chờ Neo4j sẵn sàng
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:7474 > /dev/null && exit 0
            sleep 2
          done
          echo "Neo4j không lên sau 120 giây" >&2
          exit 1
      - run: uv run pytest -m graph

  frontend:
    name: frontend (lint, kiểu, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
