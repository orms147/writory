# Mức độ dài truyện. Ý đồ sản phẩm: docs/design.md §3. Runtime đọc số từ file này.
chars_per_word_page: 3000          # 1 trang Word A4, giãn dòng đơn (ước lượng)
chapter_chars: {min: 3000, max: 10000}
scenes_per_chapter: {min: 2, max: 3}
# milestones: số mốc cốt truyện của bản kế hoạch; max_due_per_chapter: số việc đến hạn tối đa
# ở một chương (bí mật, mạch phải gỡ, mốc), trừ chương cuối (D-54). Nhịp theo độ dài, design §6.1;
# số tạm (D-49).
# player_selectable: người chơi được chọn mức này lúc khởi tạo (D-88, chủ dự án 22/10/2026: bản 1 mở
# Ngắn và Vừa; Dài và Tiểu thuyết mở sau khi đã chạy đo thật). Mức đóng vẫn chạy được bằng bench_run.
levels:
  short:  {label: "Truyện ngắn",      target_chars: 30000,  chapters: {min: 4,  max: 8},
           milestones: {min: 3, max: 5},  max_due_per_chapter: 3, player_selectable: true}
  medium: {label: "Truyện vừa",       target_chars: 90000,  chapters: {min: 10, max: 20},
           milestones: {min: 4, max: 8},  max_due_per_chapter: 3, player_selectable: true}
  long:   {label: "Truyện dài",       target_chars: 180000, chapters: {min: 20, max: 35},
           milestones: {min: 6, max: 12}, max_due_per_chapter: 3, player_selectable: false}
  # Kịch bản audio (D-155, D-156; số tạm, Claude chọn, chờ chủ dự án duyệt): đo bằng phút nghe. Độ dài thật do số
  # chương quyết (target_chars không vào đề viết). Đo 1/11/2026: một chương audio 2 cảnh ra khoảng 1360 âm tiết, tức
  # khoảng 8,5 phút ở 160 âm tiết/phút (tốc độ sách nói tiếng Anh 150–160 từ/phút, chưa đo trên TTS tiếng Việt thật);
  # model thường chọn số chương tối đa, nên mức 45 và 60 phút là một số chương. target_chars = phút × 730 (ghi chú).
  audio_30: {label: "Audio ~30 phút", target_chars: 21900, chapters: {min: 3, max: 4}, style: audio, minutes: 30,
             milestones: {min: 2, max: 3}, max_due_per_chapter: 3, player_selectable: true}
  audio_45: {label: "Audio ~45 phút", target_chars: 32850, chapters: {min: 5, max: 5}, style: audio, minutes: 45,
             milestones: {min: 3, max: 4}, max_due_per_chapter: 3, player_selectable: true}
  audio_60: {label: "Audio ~1 tiếng", target_chars: 43800, chapters: {min: 6, max: 7}, style: audio, minutes: 60,
             milestones: {min: 3, max: 5}, max_due_per_chapter: 3, player_selectable: true}
  novel:  {label: "Tiểu thuyết mỏng", target_chars: 300000, chapters: {min: 30, max: 60},
           milestones: {min: 8, max: 16}, max_due_per_chapter: 3, player_selectable: false}
