# Mức độ dài truyện. Ý đồ sản phẩm: docs/design.md §3. Runtime đọc số từ file này.
chars_per_word_page: 3000          # 1 trang Word A4, giãn dòng đơn (ước lượng)
chapter_chars: {min: 3000, max: 10000}
scenes_per_chapter: {min: 2, max: 3}
# milestones: số mốc cốt truyện của bản kế hoạch; max_due_per_chapter: số việc đến hạn tối đa
# ở một chương (bí mật, mạch phải gỡ, mốc), trừ chương cuối (D-54). Nhịp theo độ dài, design §6.1;
# số tạm (D-49).
# player_selectable: người chơi được chọn mức này lúc khởi tạo (D-88, chủ dự án 22/10/2026: bản 1 mở
# Ngắn và Vừa; Dài và Tiểu thuyết mở sau khi đã chạy đo thật). Mức đóng vẫn chạy được bằng bench_run.
levels:
  short:  {label: "Truyện ngắn",      target_chars: 30000,  chapters: {min: 4,  max: 8},
           milestones: {min: 3, max: 5},  max_due_per_chapter: 3, player_selectable: true}
  medium: {label: "Truyện vừa",       target_chars: 90000,  chapters: {min: 10, max: 20},
           milestones: {min: 4, max: 8},  max_due_per_chapter: 3, player_selectable: true}
  long:   {label: "Truyện dài",       target_chars: 180000, chapters: {min: 20, max: 35},
           milestones: {min: 6, max: 12}, max_due_per_chapter: 3, player_selectable: false}
  # Kịch bản audio (D-155, D-156, D-159): đo bằng phút nghe. Độ dài thật do số chương quyết (target_chars không vào đề
  # viết; ghi số chữ thật, khoảng 6200 ký tự mỗi chương: một chương 2 cảnh ra khoảng 1360 âm tiết, đo 1/11/2026). Phút
  # nghe theo số đo của chủ dự án (3/11/2026): mức 6–7 chương ra khoảng 30 phút với TTS thật, tức khoảng 4,5 phút
  # mỗi chương; ước tính cũ 8,5 phút/chương (160 âm tiết/phút) chậm hơn TTS thật. Khoá giữ nguyên vì truyện đã lưu
  # length_level. Số mốc tối đa ít nhất 4: đề khởi tạo đòi mỗi hồi một mốc, truyện 4 hồi cần 4 mốc (D-157).
  audio_30: {label: "Audio ~15 phút", target_chars: 21900, chapters: {min: 3, max: 4}, style: audio, minutes: 15,
             milestones: {min: 2, max: 4}, max_due_per_chapter: 3, player_selectable: true}
  audio_45: {label: "Audio ~23 phút", target_chars: 32850, chapters: {min: 5, max: 5}, style: audio, minutes: 23,
             milestones: {min: 3, max: 5}, max_due_per_chapter: 3, player_selectable: true}
  audio_60: {label: "Audio ~30 phút", target_chars: 43800, chapters: {min: 6, max: 7}, style: audio, minutes: 30,
             milestones: {min: 3, max: 5}, max_due_per_chapter: 3, player_selectable: true}
  # Siêu dài (chủ dự án, 3/11/2026): dài hơn mức 6–7 chương khoảng 1/3, "tầm 10 chương là đủ".
  audio_xl: {label: "Audio siêu dài", target_chars: 59000, chapters: {min: 9, max: 10}, style: audio, minutes: 45,
             milestones: {min: 4, max: 6}, max_due_per_chapter: 3, player_selectable: true}
  novel:  {label: "Tiểu thuyết mỏng", target_chars: 300000, chapters: {min: 30, max: 60},
           milestones: {min: 8, max: 16}, max_due_per_chapter: 3, player_selectable: false}
