# Trần và giới hạn (guardrail G8, docs/security.md). null = chưa đặt.
# D-47: số tạm, chủ dự án duyệt 20/10/2026; chỉnh lại sau lần chạy thật đầu (evals/results/).
cost_usd:
  per_scene: 0.02
  per_chapter: 0.08
  per_story: 1.00
retries:
  rewrite_per_scene: 1        # design §6.2
  extract_schema_retry: 1     # G11: chỉ cho lỗi JSON sai schema
  llm_transient: 2            # lỗi mạng/model tạm thời (LLM_UNAVAILABLE), D-14
rate_limit:
  llm_calls_per_minute_per_user: 30
  narrator_questions_per_chapter: 5   # đếm cả câu trả "Bạn chưa biết điều này." (D-40)
input:
  custom_action_max_chars: 200
  character_name_max_chars: 40
  backstory_max_chars: 600
  narrator_question_max_chars: 300   # câu hỏi người kể (D-40)
context:
  writer_max_neighbors: 30  # số nút lân cận tối đa trong ngữ cảnh model viết (D-28; tạm, D-47)
