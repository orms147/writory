# Trần và giới hạn (guardrail G8, docs/security.md). null = chưa đặt.
# D-47: số tạm, chủ dự án duyệt 20/10/2026; số thêm sau gắn "(tạm, D-47)" chủ dự án duyệt 30/10/2026 (D-131).
cost_usd:
  per_scene: 0.02
  per_chapter: 0.08
  per_story: 1.00
retries:
  rewrite_per_scene: 1        # design §6.2
  extract_schema_retry: 1     # G11: chỉ cho lỗi JSON sai schema
  llm_transient: 3            # lỗi mạng/model tạm thời (LLM_UNAVAILABLE, LLM_TIMEOUT), D-14; 2 → 3 ở D-123
  # Giây chờ trước lần thử lại thứ 1, 2, 3 của lỗi tạm, để một lần mạng chập vài chục giây không giết cả
  # chương (D-123; tạm, D-47). Không áp cho 429 hay JSON sai schema. Xấu nhất một lời gọi:
  # (1 + llm_transient) × llm_call.deadline_seconds + tổng các lần chờ.
  transient_backoff_seconds: [2, 8, 30]
  setup_repair: 1             # build_story sai quy tắc: số lượt gọi model sửa, kèm danh sách lỗi (D-54)
rate_limit:
  llm_calls_per_minute_per_user: 30
  narrator_questions_per_chapter: 5   # đếm cả câu trả "Bạn chưa biết điều này." (D-40)
input:
  custom_action_max_chars: 200
  character_name_max_chars: 40
  backstory_max_chars: 600
  personality_max_chars: 300   # tính cách nhân vật chính người chơi sửa (tạm, D-47; dùng ở D-45)
  narrator_question_max_chars: 300   # câu hỏi người kể (D-40)
narrator_notebook:   # sổ tay lớn thì người kể chỉ nhận phần liên quan tới câu hỏi (D-59; số tạm)
  max_entries: 80        # vượt số mục này hoặc max_chars thì truy hồi; phần gửi không vượt cả hai
  max_chars: 16000       # tính trên chữ sổ tay đã dựng cho model
  recent_entries: 10     # luôn kèm bấy nhiêu mục (và lời nói dối) gần đây nhất
  keyword_entries: 8     # số mục thêm theo từ khoá khi tên không trùng
# Đoạn đã hiện trên trang cho người kể (D-143; tạm, Claude, chờ chủ dự án duyệt): BM25 theo câu hỏi trên văn
# các chương đã ghi, như hệ `graph_quotes` của bài A. Đề người kể `narrator-4`. `top_k: 0` là TẮT: đề
# `narrator-3`, không đọc văn chương. Cỡ đoạn và đoạn kế như `context.page_quotes_*` (D-85, D-96); số đoạn và
# trần ký tự chọn bằng độ phủ câu trích bằng chứng, không gọi model (evals/results/2026-10-30-narrator-passages/).
narrator_pages:
  top_k: 4
  chunk_chars: 500
  max_chars: 3600
  neighbors: 1
context:
  writer_max_neighbors: 30  # số nút lân cận tối đa trong ngữ cảnh model viết (D-28; tạm, D-47)
  summary_max_chars: 800    # độ dài tối đa của tóm tắt một chương (D-49; tạm)
  # Đoạn nguyên văn đã hiện trên trang cho dàn ý và model viết (D-85; tạm, D-47). Cỡ đoạn như
  # bài đo A (D-81). `page_quotes_top_k: 0` là TẮT (mặc định): không dựng kho đoạn, đề như cũ.
  # Bật = 3 (bài A dùng 2) khi đo cùng thế giới cho thấy có lợi.
  page_quotes_top_k: 0
  page_quotes_chunk_chars: 500
  page_quotes_max_chars: 2400
  # Mỗi đoạn trúng kéo theo bấy nhiêu đoạn liền sau nó cùng chương (D-96; tạm, D-47). Bài đo A đọc
  # cùng số này cho hệ `graph_quotes`. 0 = như cũ. Chọn bằng `bench_a retrieval`.
  page_quotes_neighbors: 1
  # Số nút tối đa trong mục "Tên người đọc chưa được biết" của đề (D-94; tạm, D-47). Quá trần thì
  # giữ nút có mặt, rồi nút liên quan tới cảnh; còn lại gộp thành "Và N tên khác". Chỉ cắt đề: bộ dò
  # lộ vẫn kiểm đủ mọi tên.
  forbidden_names_max: 12
  # Nhân vật chính ở yên một nơi từng ấy chương trở lên thì mục tiêu chương và đề tạo lựa chọn đòi đổi
  # tình thế (D-98; tạm, D-47). long-tu-tien-1: ở Cốc Đèn từ chương 6, lặp cảnh từ chương 10.
  standstill_chapters: 4
  # Theo dõi mốc đã diễn ra (D-116; tạm, D-47). Bộ trích được đánh dấu mốc chưa xong có khoảng bắt đầu
  # trong chừng ấy chương tới (ca đã thấy: mốc xảy ra sớm 2 đến 4 chương). null = tắt theo dõi.
  milestone_lookahead: 4
  # Từng ấy chương liền không có biến cố nào đổi trạng thái truyện thì mục tiêu chương và đề tạo lựa
  # chọn đòi đổi, như `standstill_chapters` nhưng không dựa vào một cạnh (D-112; tạm, D-47). Biến cố:
  # người hay vật tới nơi mới, đồ vật đổi người giữ, có người chết. Mạch gỡ và bí mật lộ KHÔNG tính
  # (xảy ra đúng lịch kế hoạch dù chương là thủ tục). Bỏ khoá hay null = tắt.
  idle_chapters: 4
  # Ba cờ của đề "v3" (D-110), BẬT làm mặc định theo D-111. Số là tạm (D-47): 240 ký tự đủ 1–2 câu
  # tính cách; hai chương gần nhất là hai câu mở gần nhất mà model không thấy trong tóm tắt.
  # Tính cách (personality) của nhân vật có mặt và nhân vật lân cận còn sống vào đề dàn ý và đề
  # viết, cắt ở từng ấy ký tự mỗi người. Không bao giờ đưa backstory (có thể chứa bí mật). 0 = tắt.
  character_personality_max_chars: 240
  # Câu mở của từng ấy chương gần nhất (chữ đã hiện trên trang) vào đề viết, để không mở trùng. 0 = tắt.
  previous_openings: 2
  previous_opening_max_chars: 160
  # true: chương không có mốc nào đang diễn ra phải kết ở một tình thế mới cụ thể. false = như cũ.
  unplanned_chapter_goal: true
  # Đổi pha (D-119), TẮT mặc định để đo A/B: cứ từng ấy chương kể từ lần đổi pha trước (nhân vật chính
  # tới nơi chưa từng tới, hoặc chương đầu của một hồi; mỗi lần nhắc cũng tính là mốc mới) thì mục tiêu
  # chương đòi đổi nơi, đổi người nắm quyền quyết định hay đổi luật chơi, không thêm mối nguy cùng loại.
  # Số đề nghị khi bật: 5 (tạm, D-47). null = tắt, đề y hệt cũ.
  phase_shift_every: null
  # Ngoại hình (appearance) của nhân vật có mặt và nhân vật lân cận còn sống, sinh ở khởi tạo (D-118),
  # vào đề dàn ý và đề viết để các cảnh tả khớp nhau, cắt ở từng ấy ký tự mỗi người. 0 = tắt: tắt cho
  # tới khi đo xem có làm văn cứng hơn không.
  character_appearance_max_chars: 0
# Bộ xuất kịch bản video (D-125): chỉ admin cầm DB chạy bằng lệnh `python -m writory.export.video`, bằng key
# OpenRouter của chủ dự án (G8). Số tạm (D-47). Giới hạn thời lượng shot là số tạm, chưa tra giới hạn
# thật của app video.
video_export:
  max_budget_usd: 0.50       # trần của `--budget`: chạy thật không được vượt
  max_shots_per_scene: 12
  shot_seconds_min: 3
  shot_seconds_max: 12
  max_output_tokens: 6000    # `max_tokens` của mỗi lời gọi (gồm token suy luận)
  visual_max_chars: 300      # mô tả tiếng Anh cố định của một nhân vật hay nơi chốn
  # Tốc độ thoại tối đa của một shot (D-127; số tạm, D-47): zh, ja tính chữ mỗi giây (không tính dấu câu),
  # ngôn ngữ khác tính từ mỗi giây. Thoại của shot vượt tốc độ này nhân thời lượng thì model làm lại, rồi code
  # tách shot. Thẻ ngôn ngữ không có ở đây thì không kiểm.
  dialogue_max_per_second:
    zh: 5
    ja: 6
    vi: 5
    en: 3.5
facts:   # Fact mới do bộ trích tạo sau chương 0, từ trang (D-93; số tạm, D-47). 0 = tắt
  max_new_per_chapter: 3       # trần cả chương (cộng các cảnh)
  text_max_chars: 160          # chữ của Fact: một câu ngắn
  duplicate_overlap: 0.7       # trùng Fact đã có khi tỉ lệ âm tiết chung (Jaccard) từ ngưỡng này
  related_overlap: 0.65        # hoặc khi phần Fact mới nằm trong Fact kia từ ngưỡng này và cùng ABOUT một thực thể (D-95)
  grounded_min: 0.6            # tỉ lệ âm tiết của Fact phải có trên trang, từ ngưỡng này
  writer_max_page_facts: 12    # Fact sinh từ trang mà ngữ cảnh người viết giữ (mới nhất trước)
llm_call:   # mọi lời gọi model trả bằng key người chơi (D-64)
  # Gửi làm max_tokens (gồm token suy luận), như max_tokens_per_call của bench_run (D-43); cũng
  # là chặn trên của chi phí ước tính khi lời gọi không có usage (huỷ, đứt, thiếu usage.cost).
  max_output_tokens: 16000
  # Hạn TỔNG của một lời gọi (chat, stream, tra chi phí), giây (D-113; tạm, D-47). Quá hạn thì
  # LLM_TIMEOUT, lớp thử lại xử như lỗi mạng. Đo long-tu-tien-3: 214 lời gọi xong, p50 9,8 s, p99
  # 16,7 s, lâu nhất 111,5 s (dàn ý); một lời gọi khác treo 13121 s. 300 s là hơn 2,5 lần lâu nhất.
  deadline_seconds: 300
chapter_estimate:   # D-87: số hiện cho người chơi khi truyện chưa có chương nào để đo (tạm, D-47)
  # Bằng mức cao nhất của trung vị chi phí mỗi chương ở ba lần chạy đã đo (0,0076 đến 0,0100 USD:
  # evals/results/2026-10-21-run-tu-tien-4, -run-ky-ao-vua-2, -run-ky-ao-vua-1), vì lúc chơi còn có
  # lượt tạo lại lựa chọn.
  default_usd: 0.01
auth:   # đăng nhập bằng mã mời, chỉ khi AUTH_MODE=invite (D-89; số tạm, D-47)
  session_ttl_hours: 720          # phiên hết hạn sau ngần này giờ kể từ lúc đăng nhập
  login_attempts_per_window: 10   # số lần nhập mã (đúng hay sai) mỗi máy trong một cửa sổ
  login_window_seconds: 900       # cửa sổ cố định của bộ đếm trên
