# Kiểm văn bằng code (design §6.5 mục 5; docs/decisions.md D-18, D-19).
# null = chưa đặt. Code dùng ngưỡng chưa đặt thì báo lỗi CONFIG_LIMIT_NOT_SET.
# D-47: số tạm bằng đúng số bài đo D đã dùng (`QualityParams` trong quality/bench_d.py); chỉnh lại sau lần chạy thật đầu.
# Độ dài cảnh lấy từ story_lengths.yaml (chapter_chars chia cho số cảnh của chương).

dialogue_style: dash            # D-18. "quotes" để dành, chưa hỗ trợ.
# Truyện audio (D-156; số tạm, Claude chọn): quá ngần này lượt thoại liền nhau, không dòng kể nào xen giữa, thì cảnh
# được viết lại (một giọng đọc máy không cho người nghe biết ai nói). Khớp luật trong style_guide_audio_vi.md.
audio_dialogue_max_run: 2

repetition:
  ngram_words: 4             # độ dài cụm từ, tính bằng số từ
  max_repeats: 2             # một cụm xuất hiện quá số lần này trong một cảnh thì báo

narration:
  # D-51: ngôi kể của lời kể (không tính dòng thoại "- " và chữ trong ngoặc kép).
  # first: người kể là nhân vật chính, xưng "tôi"; third: lời kể không xưng "tôi".
  # Đề của model viết nói ngôi này (quality.narration_instruction), nên phép kiểm và đề cùng một nguồn.
  person: first
  # Số tạm (D-51), đo trên lần chạy evals/results/2026-10-20-run-tu-tien-1/ và truyện mẫu.
  min_words: 80                         # lời kể ít từ hơn thì không kiểm (cảnh gần như toàn thoại)
  first_person_min_per_100_words: 0.5   # person first: "tôi" ít hơn mức này thì báo lệch ngôi
  first_person_max_per_100_words: 0.5   # person third: "tôi" nhiều hơn mức này thì báo lệch ngôi

foreign_script:
  # Số từ Latin không phải âm tiết tiếng Việt, đứng liền nhau (không bị từ có dấu chen ngang),
  # thì báo là lẫn chữ khác hệ. Chữ Hán/Kana/Hangul luôn bị báo, không cần ngưỡng.
  latin_run_min_words: 4
  # Từ mượn hay gặp, không tính vào chuỗi trên. So không phân biệt hoa thường.
  allowed_latin_words: [ok, email, wifi, internet, video, online, offline, laptop, website, app]

cliches:
  # BẢN NHÁP do Claude (Session 2) soạn, CHỜ CHỦ DỰ ÁN DUYỆT. Cụm hay gặp ở văn AI tiếng Việt.
  # So sau chuẩn hoá NFC, không phân biệt hoa thường, khớp trọn từ.
  draft: true
  phrases:
    - thời gian như ngừng trôi
    - thời gian như ngưng đọng
    - không khí như đặc quánh lại
    - một luồng điện chạy dọc sống lưng
    - trái tim như thắt lại
    - tim như ngừng đập
    - một cảm giác khó tả
    - không thể diễn tả bằng lời
    - một nỗi sợ hãi vô hình
    - bầu không khí căng thẳng bao trùm
    - sự im lặng bao trùm
    - sự im lặng đáng sợ
    - như thể cả thế giới
    - nở một nụ cười bí ẩn
    - nụ cười nhếch mép
    - ánh mắt sắc lạnh
    - đôi mắt sâu thẳm
    - hít một hơi thật sâu
    - tâm trí rối bời
    - là minh chứng cho
    - dệt nên một bức tranh
    - bản giao hưởng của
    - một hành trình đầy
    - mọi thứ dường như
    - khoảnh khắc ấy như kéo dài vô tận
    - một làn sóng cảm xúc
    - không hề hay biết rằng
