# Model theo vai. Lý do tách vai: docs/design.md §6.5, docs/decisions.md D-3.
# null = chưa chọn. D-47: các vai chưa có bài đo riêng dùng tạm GPT-6 Luna, đo lại sau lần chạy thật đầu.

# Vai giữ trí nhớ: cố định, người chơi không đổi được.
# Người canh bản 1 chỉ kiểm bằng code nên không có vai ở đây; phần LLM để bản sau (D-88).
roles:
  outline: openai/gpt-6-luna    # dàn ý cảnh (tạm, D-47)
  extract: openai/gpt-6-luna   # trích thay đổi -> JSON (D-35, bài C v2)
  choices: openai/gpt-6-luna    # tạo 3 lựa chọn (tạm, D-47)
  narrator: openai/gpt-6-luna   # hỏi người kể (tạm, D-47)
  classify: openai/gpt-6-luna   # phân loại ô tự viết, G5 (tạm, D-47)
  setup: openai/gpt-6-luna      # khởi tạo truyện: bối cảnh, cốt truyện, nhân vật, kế hoạch + chương 0 (D-39; tạm, D-47)
  summary: openai/gpt-6-luna    # tóm tắt chương vừa ghi cho đề các chương sau (D-49; tạm, D-47)
  moderate: openai/gpt-6-luna   # kiểm duyệt nội dung đầu vào và đầu ra, G9 (D-57; tạm, D-47)

# Mức suy luận (reasoning effort của OpenRouter) cho từng vai; null = mặc định của model.
role_reasoning:
  extract: low   # D-35: bài C v2, suy luận thấp tăng F1 lớp người chơi biết 0,63 → 0,78
  outline: low   # D-47: các vai trả JSON dùng suy luận thấp như vai trích
  choices: low
  narrator: low
  classify: low
  setup: low
  summary: low
  moderate: low

# Mức người chơi chọn: chỉ đổi model viết. Chỉ thêm model đã qua bài đo D.
# D-33 (Chủ dự án, 20/10/2026): một mức duy nhất, GPT-6 Luna. Không có mức GPT-6.1 Sol (đắt).
writer_tiers:
  - id: standard
    label: "Tiêu chuẩn"
    model: "openai/gpt-6-luna"
    eval_result: "evals/results/2026-10-20-quality-r2/"
    reasoning: none   # như bài D đã đo (D-43, chủ dự án duyệt 20/10/2026); null = mặc định của model

# Giá (USD / 1 triệu token), chỉ để ước tính chi phí tối đa của lời gọi không có usage: bị huỷ,
# đứt giữa chừng, thiếu usage.cost (D-64). Mọi model ở roles và writer_tiers phải có giá ở đây,
# không thì lời gọi bằng key người chơi bị từ chối trước khi gửi. Chi phí thật lấy từ usage.cost
# hoặc tra lại theo id generation. Nguồn: evals/scenarios/quality/models.yaml
# (openrouter.ai/api/v1/models, 20/10/2026).
prices:
  openai/gpt-6-luna: {in: 0.10, out: 0.50}
