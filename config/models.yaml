# null = chưa chọn; chọn ở tuần 2 sau bài đo D (docs/eval.md).

# Vai giữ trí nhớ: cố định, người chơi không đổi được.
roles:
  outline: null      # dàn ý cảnh
  extract: null      # trích thay đổi -> JSON
  guard: null        # người canh (phần LLM)
