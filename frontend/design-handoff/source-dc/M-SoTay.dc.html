<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sổ tay (điện thoại) — Ngọc Bội Rạn — WriTory</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9f4fdc577a938bca1fe9340fa8d526c1">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121110}
a{color:#E0674B}a:hover{color:#F08A70}
</style>
</helmet>
<div class="wt" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3ECDD; color: #ECE6DA; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 110px 24px; font-family: 'Literata', serif; font-size: 18px; line-height: 1.75; color: #1F1B16">Mưa trên núi Thanh Vân không rơi xuống mà trôi ngang, như ai đó vắt một tấm lụa ướt qua sườn đá…</div>
  <a href="M-Doc.dc.html" aria-label="Đóng sổ tay" style="position: absolute; inset: 0; background: rgba(18,17,16,.55)"></a>

  <section aria-label="Sổ tay" class="wt-grain" style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; border-radius: 24px 24px 0 0; background: #171614; box-shadow: 0 -20px 60px -20px rgba(0,0,0,.8); display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding: 10px 0 4px" aria-hidden="true"><span style="width: 40px; height: 5px; border-radius: 5px; background: #4A453E"></span></div>
    <div style="padding: 6px 20px 0; display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 28px">Sổ tay của Thanh Y</h1>
      <a href="M-Doc.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #D9D1C3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>
    <div role="tablist" aria-label="Mục sổ tay" style="display: flex; gap: 6px; overflow-x: auto; padding: 10px 20px 12px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 13px; font-weight: 600">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="flex: 1 1 auto; overflow-y: auto; padding: 0 20px 28px">
      <sc-if value="{{isEntries}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{entries}}" as="e" hint-placeholder-count="4">
            <article style="padding: 16px 0; border-bottom: 1px solid #26231F; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
                <h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px; line-height: 1.15">{{e.name}}</h2>
                <span style="font-size: 11px; color: #9A9286; white-space: nowrap">từ ch. {{e.ch}}</span>
              </div>
              <sc-if value="{{e.hasAka}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; color: #B5AC9E">còn được gọi: {{e.aka}}</span></sc-if>
              <blockquote style="margin: 2px 0 0; padding-left: 12px; border-left: 2px solid #4A453E; font-family: 'Literata', serif; font-style: italic; font-size: 14px; line-height: 1.6; color: #D9D1C3">“{{e.quote}}”</blockquote>
            </article>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{isLies}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{lies}}" as="l" hint-placeholder-count="2">
            <article style="padding: 16px 0; border-bottom: 1px solid #26231F; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; color: #B5AC9E">Nói với <span style="color: #ECE6DA; font-weight: 600">{{l.to}}</span> · chương {{l.ch}}</span>
              <p style="margin: 0; font-family: 'Literata', serif; font-size: 17px; line-height: 1.5">{{l.said}}</p>
            </article>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tab: 'people' };
  renderVals() {
    const D = {
      people: [
        { name: 'Vân Phong', aka: 'sư huynh Vân Phong', ch: 1, quote: 'Sư huynh Vân Phong nằm giữa hai giá sách, mắt mở, môi tím.' },
        { name: 'Tô Vãn Tình', aka: '', ch: 1, quote: 'Ở cuối hành lang Tàng Kinh Các, Tô Vãn Tình đứng yên nhìn nàng.' },
        { name: 'Chấp sự Hồ', aka: '', ch: 2, quote: 'Giọng chấp sự Hồ vang lên sau lưng, khàn như tiếng chổi tre quét sân.' },
        { name: 'Trưởng lão Mạc Hàn', aka: 'trưởng lão Mạc', ch: 2, quote: 'Trưởng lão Mạc Hàn không nhìn đám tạp dịch.' }
      ],
      places: [
        { name: 'Tàng Kinh Các', aka: '', ch: 1, quote: 'Nàng đẩy cửa Tàng Kinh Các lúc trời còn chưa rạng.' },
        { name: 'Tạp Dịch Viện', aka: 'viện', ch: 2, quote: 'Lâm Thanh Y đứng dưới mái hiên Tạp Dịch Viện, hai tay giấu trong ống tay áo.' },
        { name: 'Từ đường', aka: '', ch: 2, quote: 'Đường lên Từ đường có chín trăm bậc.' }
      ],
      items: [
        { name: 'Ngọc bội khắc chữ “Vân”', aka: 'ngọc bội, miếng ngọc', ch: 1, quote: 'Nàng gỡ từng ngón tay lạnh ngắt ra khỏi miếng ngọc.' },
        { name: 'Đèn trường minh', aka: '', ch: 2, quote: 'Bên trong, hàng trăm ngọn đèn trường minh cháy đều trên giá gỗ mun.' },
        { name: 'Chìa khoá đồng', aka: 'chùm chìa khoá', ch: 2, quote: 'Chấp sự Hồ khẽ đưa tay chạm vào thắt lưng, nơi chùm chìa khoá vẫn treo.' }
      ],
      facts: [
        { name: 'Ngọc bội đã rạn', aka: '', ch: 2, quote: 'Vết rạn chạy chéo qua chữ “Vân” khắc trên mặt ngọc. Đêm qua nó chưa có.' },
        { name: 'Một ngọn đèn trường minh đã tắt', aka: '', ch: 2, quote: 'Chỉ có một ngọn đã tắt: ngọn thứ bảy, hàng thứ ba.' },
        { name: 'Vân Phong chết trước canh ba', aka: '', ch: 2, quote: '- Vân Phong chết trước canh ba - ông nói, giọng đều như đọc sổ.' }
      ]
    };
    const tab = this.state.tab;
    const tabs = [['people', 'Nhân vật'], ['places', 'Nơi chốn'], ['items', 'Đồ vật'], ['facts', 'Sự thật'], ['lies', 'Lời nói dối của tôi']].map(([id, label]) => {
      const on = tab === id;
      return { label, sel: on ? 'true' : 'false', bd: on ? '#ECE6DA' : '#3A3631', bg: on ? '#ECE6DA' : 'transparent', fg: on ? '#121110' : '#D9D1C3', pick: () => this.setState({ tab: id }) };
    });
    return {
      tabs, entries: (D[tab] || []).map((e) => ({ ...e, hasAka: !!e.aka })), isEntries: tab !== 'lies', isLies: tab === 'lies',
      lies: [
        { to: 'Chấp sự Hồ', ch: 1, said: '- Đệ tử không thấy gì lạ đêm qua.' },
        { to: 'Tô Vãn Tình', ch: 1, said: '- Ta chỉ đi lấy nước.' }
      ]
    };
  }
}
</script>
</body>
</html>
