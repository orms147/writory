<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khởi tạo · hướng truyện (điện thoại) — WriTory</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9f4fdc577a938bca1fe9340fa8d526c1">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121110}
a{color:#E0674B}a:hover{color:#F08A70}
</style>
</helmet>
<div class="wt wt-grain" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121110; color: #ECE6DA; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55; display: flex; flex-direction: column">
  <header style="padding: 48px 12px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="M-KhoiTao.dc.html" aria-label="Quay lại bối cảnh" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #D9D1C3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <span style="font-size: 13px; color: #B5AC9E">Bước 3 / 4 · Hướng truyện</span>
      <span style="width: 44px"></span>
    </div>
    <div style="margin: 0 8px; height: 3px; border-radius: 3px; background: #24221F"><div style="width: 65%; height: 100%; border-radius: 3px; background: #E0674B"></div></div>
  </header>

  <main style="flex: 1 1 auto; overflow: hidden; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 30px; line-height: 1.05">Chuyện gì sẽ xảy ra ở Thanh Vân Tông?</h1>
      <p style="margin: 0; font-size: 13px; color: #9A9286">Chọn một hướng. Phần còn lại sẽ tự lộ ra trên trang.</p>
    </div>
    <div role="radiogroup" aria-label="Hướng truyện" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{plots}}" as="p" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{p.checked}}" onClick="{{p.pick}}" class="wt-card" data-selected="{{p.selFlag}}" style="text-align: left; border: 1px solid #2E2B27; border-radius: 16px; background: {{p.bg}}; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; color: #ECE6DA; position: relative">
          <span class="wt-seal" style="position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border: 2px solid #E0674B; border-radius: 6px; color: #E0674B; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
          <span style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9A9286">{{p.kind}}</span>
          <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 23px; line-height: 1.1; padding-right: 34px">{{p.title}}</span>
          <span style="font-family: 'Literata', serif; font-size: 14px; line-height: 1.6; color: #D9D1C3">{{p.hook}}</span>
        </button>
      </sc-for>
    </div>
  </main>

  <div style="padding: 12px 20px 28px; border-top: 1px solid #26231F; display: flex; flex-direction: column; gap: 6px">
    <a href="{{nextHref}}" aria-disabled="{{noPick}}" class="wt-btn wt-btn-primary" style="height: 54px; border-radius: 12px; background: {{btnBg}}; color: {{btnFg}}; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">{{btnLabel}}</a>
    <button style="height: 44px; border: none; background: transparent; color: #B5AC9E; font-size: 14px">Ba hướng khác</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { pick: null };
  renderVals() {
    const P = [
      { kind: 'Bí ẩn', title: 'Án mạng trong Tàng Kinh Các', hook: 'Sư huynh Vân Phong chết giữa đêm tế tổ. Bạn là người đầu tiên thấy xác, và đã lấy đi thứ hắn còn nắm trong tay.' },
      { kind: 'Thân phận', title: 'Linh căn đi mượn', hook: 'Sáng nay bạn thức dậy với linh căn hạng nhất mà hôm qua chưa có. Có người đã cho bạn mượn, và người đó sẽ đến đòi.' },
      { kind: 'Giao kèo', title: 'Món nợ dưới chân núi', hook: 'Một ma tu bị thương xin bạn giấu hắn ba ngày. Đổi lại, hắn hứa trả lời bất kỳ một câu hỏi nào của bạn.' }
    ];
    const p = this.state.pick;
    const plots = P.map((x, i) => { const on = i === p; return { ...x, checked: on ? 'true' : 'false', selFlag: on ? '1' : '0', bg: on ? '#201D1A' : '#181715', pick: () => this.setState({ pick: i }) }; });
    const has = p !== null;
    return { plots, noPick: has ? 'false' : 'true', nextHref: has ? 'M-NhanVat.dc.html' : '#chon', btnBg: has ? '#B8432B' : '#4A453E', btnFg: has ? '#FFF6EE' : '#B5AC9E', btnLabel: has ? 'Gặp ba nhân vật →' : 'Chọn một hướng' };
  }
}
</script>
</body>
</html>
