<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khởi tạo · khuôn truyện (điện thoại) — WriTory</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9f4fdc577a938bca1fe9340fa8d526c1">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121110}
a{color:#E0674B}a:hover{color:#F08A70}
</style>
</helmet>
<div class="wt wt-grain" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121110; color: #ECE6DA; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55; display: flex; flex-direction: column">
  <header style="padding: 48px 12px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="M-ThuVien.dc.html" aria-label="Thoát" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #D9D1C3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <span style="font-size: 13px; color: #B5AC9E">Bước 1 / 4 · Khuôn truyện</span>
      <span style="width: 44px"></span>
    </div>
    <div style="margin: 0 8px; height: 3px; border-radius: 3px; background: #24221F"><div style="width: 15%; height: 100%; border-radius: 3px; background: #E0674B"></div></div>
  </header>

  <main style="flex: 1 1 auto; overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 30px; line-height: 1.05">Loại truyện nào?</h1>

    <section aria-labelledby="mtl" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="mtl" style="margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9A9286; font-weight: 600">Thể loại chính · chọn một</h2>
      <div role="radiogroup" aria-label="Thể loại chính" style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{genres}}" as="g" hint-placeholder-count="7">
          <button role="radio" aria-checked="{{g.checked}}" onClick="{{g.pick}}" style="height: 40px; padding: 0 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; border: 1px solid {{g.bd}}; background: {{g.bg}}; color: {{g.fg}}">{{g.label}}</button>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #9A9286">Tag phụ: <span style="color: #D9D1C3">Bí ẩn</span> · <button style="border: none; background: transparent; color: #E0674B; font-size: 12px; padding: 0; min-height: 32px">+ thêm</button></span>
    </section>

    <section aria-labelledby="mten" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 id="mten" style="margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9A9286; font-weight: 600">Tên người &amp; địa danh</h2>
        <span style="font-size: 11px; color: #9A9286">{{namesNote}}</span>
      </div>
      <div role="radiogroup" aria-label="Kiểu tên nhân vật" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1A1917; border: 1px solid #2A2724">
        <sc-for list="{{nameOpts}}" as="o" hint-placeholder-count="2"><button role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="height: 40px; border: none; border-radius: 9px; font-size: 13.5px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button></sc-for>
      </div>
      <div role="radiogroup" aria-label="Kiểu địa danh" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1A1917; border: 1px solid #2A2724">
        <sc-for list="{{placeOpts}}" as="o" hint-placeholder-count="2"><button role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="height: 40px; border: none; border-radius: 9px; font-size: 13.5px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button></sc-for>
      </div>
      <span style="font-family: 'Literata', serif; font-style: italic; font-size: 13px; color: #B5AC9E">Ví dụ: {{example}}</span>
    </section>

    <section aria-labelledby="mdd" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="mdd" style="margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9A9286; font-weight: 600">Độ dài</h2>
      <div role="radiogroup" aria-label="Độ dài" style="display: flex; flex-direction: column; border-top: 1px solid #2E2B27">
        <sc-for list="{{lengths}}" as="l" hint-placeholder-count="4">
          <button role="radio" aria-checked="{{l.checked}}" onClick="{{l.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 2px; border: none; border-bottom: 1px solid #2E2B27; background: transparent; text-align: left; color: #ECE6DA">
            <span style="width: 18px; height: 18px; flex: 0 0 18px; border-radius: 50%; border: 2px solid {{l.ring}}; display: grid; place-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{l.dot}}"></span></span>
            <span style="flex: 1 1 auto; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px">{{l.name}}</span>
            <span style="font-size: 12px; color: #9A9286">~{{l.pages}} trang · {{l.ch}} chương</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="mgv" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="mgv" style="margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9A9286; font-weight: 600">Giọng văn · độ u tối</h2>
      <div role="radiogroup" aria-label="Giọng văn" style="display: flex; flex-wrap: wrap; gap: 6px">
        <button role="radio" aria-checked="true" style="height: 38px; padding: 0 13px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid #E0674B; background: rgba(212,85,58,.16); color: #F7D5CA">Trầm, lạnh</button>
        <button role="radio" aria-checked="false" style="height: 38px; padding: 0 13px; border-radius: 999px; font-size: 13px; border: 1px solid #3A3631; background: transparent; color: #D9D1C3">Trữ tình</button>
        <button role="radio" aria-checked="false" style="height: 38px; padding: 0 13px; border-radius: 999px; font-size: 13px; border: 1px solid #3A3631; background: transparent; color: #D9D1C3">Gai góc</button>
        <button role="radio" aria-checked="false" style="height: 38px; padding: 0 13px; border-radius: 999px; font-size: 13px; border: 1px solid #3A3631; background: transparent; color: #D9D1C3">Hóm hỉnh</button>
      </div>
      <div role="radiogroup" aria-label="Độ u tối" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1A1917; border: 1px solid #2A2724">
        <button role="radio" aria-checked="false" style="height: 40px; border: none; border-radius: 9px; font-size: 13.5px; font-weight: 600; background: transparent; color: #B5AC9E">Nhẹ</button>
        <button role="radio" aria-checked="true" style="height: 40px; border: none; border-radius: 9px; font-size: 13.5px; font-weight: 600; background: #ECE6DA; color: #121110">Vừa</button>
        <button role="radio" aria-checked="false" style="height: 40px; border: none; border-radius: 9px; font-size: 13.5px; font-weight: 600; background: transparent; color: #B5AC9E">Đậm</button>
      </div>
    </section>

    <section aria-labelledby="mgn" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="mgn" style="margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9A9286; font-weight: 600">Góc nhìn</h2>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid #2E2B27; border-bottom: 1px solid #2E2B27"><span style="font-weight: 600">Chỉ nhân vật chính</span><span style="font-size: 12px; color: #9A9286">Nhiều nhân vật · sắp có</span></div>
    </section>
  </main>

  <div style="padding: 12px 20px 28px; border-top: 1px solid #26231F; display: flex; flex-direction: column; gap: 6px">
    <a href="M-KhoiTao.dc.html" class="wt-btn wt-btn-primary" style="height: 54px; border-radius: 12px; background: #B8432B; color: #FFF6EE; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">Gợi ý bối cảnh <span class="wt-arrow">→</span></a>
    <span style="font-size: 12px; color: #9A9286; text-align: center">Ước tính cả truyện: chưa có ước tính</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { genre: 'ky-ao', names: null, places: null, len: 'dai' };
  renderVals() {
    const st = this.state;
    const G = [['ky-ao', 'Kỳ ảo · tu tiên', 'han', 'hu'], ['co-trang', 'Cổ trang', 'han', 'hu'], ['lich-su', 'Lịch sử', 'viet', 'that'], ['trinh-tham', 'Trinh thám', 'viet', 'that'], ['do-thi', 'Đô thị', 'viet', 'that'], ['hien-dai', 'Hiện đại', 'viet', 'hu'], ['tuong-lai', 'Tương lai giả tưởng', 'viet', 'hu']];
    const g = G.find((x) => x[0] === st.genre) || G[0];
    const names = st.names || g[2], places = st.places || g[3];
    const custom = (st.names && st.names !== g[2]) || (st.places && st.places !== g[3]);
    const genres = G.map(([id, label]) => { const c = id === st.genre; return { label, checked: c ? 'true' : 'false', bd: c ? '#E0674B' : '#3A3631', bg: c ? 'rgba(212,85,58,.16)' : 'transparent', fg: c ? '#F7D5CA' : '#D9D1C3', pick: () => this.setState({ genre: id, names: null, places: null }) }; });
    const seg = (cur, id, label, key) => { const c = cur === id; return { label, checked: c ? 'true' : 'false', bg: c ? '#ECE6DA' : 'transparent', fg: c ? '#121110' : '#B5AC9E', pick: () => this.setState({ [key]: id }) }; };
    const L = [['ngan', 'Truyện ngắn', 10, '4–8'], ['vua', 'Truyện vừa', 30, '10–20'], ['dai', 'Truyện dài', 60, '20–35'], ['mong', 'Tiểu thuyết mỏng', 100, '30–60']];
    const lengths = L.map(([id, name, pages, ch]) => { const c = id === st.len; return { name, pages, ch, checked: c ? 'true' : 'false', ring: c ? '#E0674B' : '#4A453E', dot: c ? '#E0674B' : 'transparent', pick: () => this.setState({ len: id }) }; });
    const example = (names === 'han' ? 'Lâm Thanh Y' : 'Nguyễn Thị Hạnh') + ', ' + (places === 'that' ? 'phố Hàng Bạc' : (names === 'han' ? 'Thanh Vân Tông' : 'phố Bến Mây'));
    return {
      genres, lengths, example,
      nameOpts: [seg(names, 'han', 'Tên Hán Việt', 'names'), seg(names, 'viet', 'Tên Việt', 'names')],
      placeOpts: [seg(places, 'hu', 'Địa danh hư cấu', 'places'), seg(places, 'that', 'Địa danh có thật', 'places')],
      namesNote: custom ? 'đã đổi' : 'theo thể loại'
    };
  }
}
</script>
</body>
</html>
