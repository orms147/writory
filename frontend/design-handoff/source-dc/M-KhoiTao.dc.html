<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khởi tạo · bối cảnh (điện thoại) — WriTory</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9f4fdc577a938bca1fe9340fa8d526c1">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121110}
a{color:#E0674B}a:hover{color:#F08A70}
</style>
</helmet>
<div class="wt wt-grain" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121110; color: #ECE6DA; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55; display: flex; flex-direction: column">
  <header style="padding: 48px 12px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="M-Khuon.dc.html" aria-label="Quay lại khuôn truyện" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #D9D1C3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <span style="font-size: 13px; color: #B5AC9E">Bước 2 / 4 · Bối cảnh</span>
      <span style="width: 44px"></span>
    </div>
    <div style="margin: 0 8px; height: 3px; border-radius: 3px; background: #24221F"><div style="width: 40%; height: 100%; border-radius: 3px; background: #E0674B"></div></div>
  </header>

  <div style="padding: 20px 20px 4px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 34px; line-height: 1.05">Ba nơi để bắt đầu</h1>
    <p style="margin: 0; font-size: 13px; color: #9A9286">Vuốt ngang để xem, chạm để chọn.</p>
  </div>

  <div role="radiogroup" aria-label="Bối cảnh" style="flex: 1 1 auto; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 16px 20px; align-items: stretch">
    <sc-for list="{{settings}}" as="s" hint-placeholder-count="3">
      <button role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" class="wt-card" data-selected="{{s.selFlag}}" style="flex: 0 0 300px; scroll-snap-align: center; text-align: left; padding: 0; border: 1px solid #2E2B27; border-radius: 20px; overflow: hidden; background: #181715; color: #ECE6DA; display: flex; flex-direction: column">
        <span style="height: 200px; position: relative; display: block; background: {{s.tint}}; overflow: hidden">
          <img src="/_blob/3e0bfc2f582f0aee5884e77aaa1abbe0" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{s.pos}}; mix-blend-mode: luminosity; opacity: .8">
          <span style="position: absolute; inset: 0; background: linear-gradient(0deg, #181715 0%, rgba(24,23,21,0) 70%)"></span>
          <span style="position: absolute; left: 18px; top: 10px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 40px; color: rgba(236,230,218,.85)">{{s.num}}</span>
          <span class="wt-seal" style="position: absolute; top: 16px; right: 16px; width: 46px; height: 46px; border: 2px solid #E0674B; border-radius: 8px; color: #E0674B; display: grid; place-items: center; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 15px; background: rgba(18,17,16,.5)">Chọn</span>
        </span>
        <span style="padding: 6px 20px 22px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 27px; line-height: 1.1">{{s.title}}</span>
          <span style="font-family: 'Literata', serif; font-size: 15px; line-height: 1.65; color: #D9D1C3">{{s.intro}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: center; gap: 8px; padding-bottom: 8px" aria-hidden="true">
    <sc-for list="{{settings}}" as="s" hint-placeholder-count="3"><span style="width: {{s.dotW}}; height: 6px; border-radius: 6px; background: {{s.dotC}}"></span></sc-for>
  </div>

  <div style="padding: 12px 20px 28px; border-top: 1px solid #26231F; display: flex; flex-direction: column; gap: 8px">
    <a href="M-HuongTruyen.dc.html" class="wt-btn wt-btn-primary" style="height: 54px; border-radius: 12px; background: #B8432B; color: #FFF6EE; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">Chọn {{curShort}} <span class="wt-arrow">→</span></a>
    <button style="height: 44px; border: none; background: transparent; color: #B5AC9E; font-size: 14px">Ba bối cảnh khác</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { pick: 0 };
  renderVals() {
    const S = [
      { num: 'I', short: 'Thanh Vân Tông', title: 'Thanh Vân Tông, đêm tế tổ', tint: '#2A1E1A', pos: '70% 30%', intro: 'Tông môn trên đỉnh núi mây, nơi đệ tử tạp dịch gánh nước dưới chân tiên nhân. Đêm nay toàn tông tế tổ, và không ai được phép ngủ.' },
      { num: 'II', short: 'bến Vong Xuyên', title: 'Bến đò Vong Xuyên', tint: '#1A2622', pos: '20% 60%', intro: 'Trấn nhỏ bên dòng sông có sương không bao giờ tan. Người lái đò chỉ nhận tiền công bằng ký ức.' },
      { num: 'III', short: 'hoàng thành', title: 'Hoàng thành Đại Lương', tint: '#1C1E28', pos: '50% 80%', intro: 'Triều đình nuôi tu sĩ như nuôi chim ưng. Bạn là thư lại nhỏ ở Khâm Thiên Giám, nơi chép tên mọi vì sao rơi.' }
    ];
    const p = this.state.pick;
    const settings = S.map((s, i) => { const on = i === p; return { ...s, checked: on ? 'true' : 'false', selFlag: on ? '1' : '0', dotW: on ? '22px' : '6px', dotC: on ? '#E0674B' : '#4A453E', pick: () => this.setState({ pick: i }) }; });
    return { settings, curShort: S[p].short };
  }
}
</script>
</body>
</html>
