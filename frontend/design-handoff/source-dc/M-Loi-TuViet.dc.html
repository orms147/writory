<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9f4fdc577a938bca1fe9340fa8d526c1">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3ECDD}
a{color:#B8432B}a:hover{color:#8E3220}
</style>
</helmet>
<div class="wt wt-grain wt-grain-paper" data-paper="1" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3ECDD; color: #1F1B16; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55; display: flex; flex-direction: column">
  <header style="padding: 44px 8px 0">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="M-LuaChon.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #4E4538"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <div style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 19px">Ngọc Bội Rạn</span><span style="font-size: 12px; color: #6B5F4E">Hết chương 2 · tự viết hành động</span></div>
    </div>
  </header>

  <main style="flex: 1 1 auto; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 26px">Thanh Y sẽ…</h1>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><label for="tv" style="font-size: 13px; font-weight: 600">Tự viết hành động</label><span style="font-size: 12px; color: #6B5F4E; font-variant-numeric: tabular-nums">{{count}} / 200</span></div>
      <textarea id="tv" class="wt-input wt-input-paper" rows="4" maxlength="200" aria-invalid="true" aria-describedby="tv-loi" style="padding: 12px; border-radius: 12px; border: 1.5px solid #B8432B; background: #FBF6EC; color: #1F1B16; font-family: 'Literata', serif; font-size: 15.5px; line-height: 1.55; resize: none">{{text}}</textarea>
      <span id="tv-loi" role="alert" style="display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: #8E3220"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; margin-top: 3px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/></svg>{{msg}}</span>
    </div>
    <span style="font-size: 12px; color: #6B5F4E">Lựa chọn chưa được gửi, chưa có gì bị trừ.</span>
  </main>

  <div style="margin: 10px 12px 24px; padding: 12px; border-radius: 18px; background: #1F1B16; display: flex; justify-content: flex-end">
    <span aria-disabled="true" style="height: 50px; padding: 0 18px; border-radius: 12px; background: #4A453E; color: #B5AC9E; font-weight: 600; display: flex; align-items: center">Sửa rồi gửi</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"truongHop":{"editor":"enum","options":["trong","dai","ngoai","khonghieu","chan"],"default":"ngoai"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = [
      ['trong', 'Trống', '', 'Bạn chưa viết gì. Gõ một hành động, hoặc chọn một trong ba hướng.'],
      ['dai', 'Quá dài', 'Giả vờ ngất, rồi khi mọi người xúm lại thì lẻn ra sau giá đèn, nhặt tro, giấu vào tay áo, sau đó tìm chấp sự Hồ hỏi về chùm chìa khoá, rồi lại quay về Từ đường trước khi trưởng lão kịp nhận ra, và cuối cùng…', 'Hành động dài hơn giới hạn. Hãy rút gọn lại.'],
      ['ngoai', 'Ngoài truyện', 'Kể cho tôi nghe công thức làm bánh mì.', 'Câu này nằm ngoài câu chuyện. Hãy viết điều Thanh Y làm trong cảnh.'],
      ['khonghieu', 'Không hiểu', 'cái kia đi chỗ đó', 'Ngòi bút chưa hiểu hành động này. Thử viết rõ: Thanh Y làm gì, với ai.'],
      ['chan', 'Không viết', '[nội dung bị chặn]', 'WriTory không viết nội dung này. Hãy viết lại theo cách khác.']
    ];
    const pick = this.props.truongHop ?? 'ngoai';
    const cur = C.find((x) => x[0] === pick) || C[2];
    return { text: cur[2], msg: cur[3], count: String(cur[2].length) };
  }
}
</script>
</body>
</html>
