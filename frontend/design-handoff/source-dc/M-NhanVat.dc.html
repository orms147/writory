<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khởi tạo · nhân vật (điện thoại) — WriTory</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9f4fdc577a938bca1fe9340fa8d526c1">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121110}
a{color:#E0674B}a:hover{color:#F08A70}
</style>
</helmet>
<div class="wt wt-grain" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121110; color: #ECE6DA; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55; display: flex; flex-direction: column">
  <header style="padding: 48px 12px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="M-HuongTruyen.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #D9D1C3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <span style="font-size: 13px; color: #B5AC9E">Bước 4 / 4 · Nhân vật</span>
      <span style="width: 44px"></span>
    </div>
    <div style="margin: 0 8px; height: 3px; border-radius: 3px; background: #24221F"><div style="width: 90%; height: 100%; border-radius: 3px; background: #E0674B"></div></div>
  </header>

  <main style="flex: 1 1 auto; overflow: hidden; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 32px; line-height: 1.05">Bạn sẽ là ai?</h1>
    <div role="radiogroup" aria-label="Nhân vật chính" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{cands}}" as="c" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="border: 1px solid {{c.bd}}; border-radius: 14px; background: {{c.bg}}; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #ECE6DA">
          <span style="width: 52px; height: 52px; border-radius: 50%; background: {{c.disc}}; display: grid; place-items: center; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 26px; color: #F3ECDD">{{c.initial}}</span>
          <span style="font-size: 13px; font-weight: 600; text-align: center; line-height: 1.25">{{c.name}}</span>
          <span style="font-size: 11px; color: #9A9286; text-align: center; line-height: 1.3">{{c.short}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="mnv-ten" style="font-size: 13px; font-weight: 500; color: #D9D1C3">Tên</label>
      <input id="mnv-ten" class="wt-input" type="text" value="{{cur.name}}" maxlength="40" style="height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid #3A3631; background: #1E1C1A; color: #ECE6DA; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 500; color: #D9D1C3">Tính cách</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{traits}}" as="t" hint-placeholder-count="3">
          <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #24221F; border: 1px solid #3A3631; display: inline-flex; align-items: center; font-size: 13px">{{t.label}}</span>
        </sc-for>
        <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px dashed #4A453E; background: transparent; color: #B5AC9E; font-size: 13px">+ Thêm</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between"><label for="mnv-qk" style="font-size: 13px; font-weight: 500; color: #D9D1C3">Quá khứ</label><span style="font-size: 12px; color: #9A9286; font-variant-numeric: tabular-nums">{{pastLen}} / 400</span></div>
      <textarea id="mnv-qk" class="wt-input" rows="5" maxlength="400" value="{{cur.past}}" style="padding: 12px 14px; border-radius: 12px; border: 1px solid #3A3631; background: #1E1C1A; color: #ECE6DA; font-family: 'Literata', serif; font-size: 15px; line-height: 1.6; resize: none"></textarea>
    </div>
  </main>

  <div style="padding: 12px 20px 28px; border-top: 1px solid #26231F; display: flex; flex-direction: column; gap: 6px">
    <a href="M-Cho.dc.html" class="wt-btn wt-btn-primary" style="height: 54px; border-radius: 12px; background: #B8432B; color: #FFF6EE; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">Bắt đầu chương 1 <span class="wt-arrow">→</span></a>
    <span style="font-size: 12px; color: #9A9286; text-align: center">Ước tính chương 1: chưa có ước tính</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { pick: 0 };
  renderVals() {
    const C = [
      { name: 'Lâm Thanh Y', initial: 'Y', short: 'tạp dịch, 19', disc: 'radial-gradient(circle at 35% 30%, #B8432B, #5A2016)', traits: ['Lặng lẽ', 'Nhớ dai', 'Ghét mắc nợ'], past: 'Con gái một thợ đúc kiếm dưới chân núi. Mười năm trước cha nàng bị đuổi khỏi tông môn vì một thanh kiếm mà không ai được phép nhắc tên.' },
      { name: 'Hàn Mặc', initial: 'M', short: 'chép kinh, 24', disc: 'radial-gradient(circle at 35% 30%, #4E6A5E, #1E2B26)', traits: ['Khéo miệng', 'Tham vọng', 'Sợ bóng tối'], past: 'Vào tông môn nhờ một lá thư tiến cử viết bằng chính nét chữ của mình. Ba năm nay chép kinh trong Tàng Kinh Các.' },
      { name: 'Đường Diệp', initial: 'D', short: 'đầu bếp, 30', disc: 'radial-gradient(circle at 35% 30%, #6B5F4E, #2A2520)', traits: ['Thẳng tính', 'Hay cười', 'Tay không rời dao'], past: 'Từng là tán tu đã tới Trúc Cơ, rồi tự phế tu vi và xin vào làm bếp. Chưa từng nói với ai vì sao.' }
    ];
    const p = this.state.pick;
    const cands = C.map((c, i) => { const on = i === p; return { ...c, checked: on ? 'true' : 'false', bd: on ? '#E0674B' : '#2E2B27', bg: on ? '#201D1A' : '#181715', pick: () => this.setState({ pick: i }) }; });
    return { cands, cur: C[p], traits: C[p].traits.map((label) => ({ label })), pastLen: String(C[p].past.length) };
  }
}
</script>
</body>
</html>
