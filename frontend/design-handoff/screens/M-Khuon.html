<div class="wt wt-grain" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121110; color: #ECE6DA; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.55; display: flex; flex-direction: column">

          <button role="radio" aria-checked="false" style="height: 40px; padding: 0 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; border: 1px solid #3A3631; background: transparent; color: #D9D1C3">Đô thị</button>
        
          <button role="radio" aria-checked="false" style="height: 40px; padding: 0 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; border: 1px solid #3A3631; background: transparent; color: #D9D1C3">Hiện đại</button>
        
          <button role="radio" aria-checked="false" style="height: 40px; padding: 0 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; border: 1px solid #3A3631; background: transparent; color: #D9D1C3">Tương lai giả tưởng</button>

      <span style="font-size: 12px; color: #9A9286">Tag phụ: <span style="color: #D9D1C3">Bí ẩn</span> · <button style="border: none; background: transparent; color: #E0674B; font-size: 12px; padding: 0; min-height: 32px">+ thêm</button></span>

      <div role="radiogroup" aria-label="Kiểu địa danh" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1A1917; border: 1px solid #2A2724">

            <span style="width: 18px; height: 18px; flex: 0 0 18px; border-radius: 50%; border: 2px solid #4A453E; display: grid; place-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: transparent"></span></span>
            <span style="flex: 1 1 auto; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px">Truyện ngắn</span>
            <span style="font-size: 12px; color: #9A9286">~10 trang · 4–8 chương</span>
          </button>
        
          <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 2px; border: none; border-bottom: 1px solid #2E2B27; background: transparent; text-align: left; color: #ECE6DA">

            <span style="flex: 1 1 auto; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px">Truyện vừa</span>
            <span style="font-size: 12px; color: #9A9286">~30 trang · 10–20 chương</span>
          </button>
        
          <button role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 2px; border: none; border-bottom: 1px solid #2E2B27; background: transparent; text-align: left; color: #ECE6DA">
            <span style="width: 18px; height: 18px; flex: 0 0 18px; border-radius: 50%; border: 2px solid #E0674B; display: grid; place-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E0674B"></span></span>
            <span style="flex: 1 1 auto; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px">Truyện dài</span>

            <span style="width: 18px; height: 18px; flex: 0 0 18px; border-radius: 50%; border: 2px solid #4A453E; display: grid; place-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: transparent"></span></span>
            <span style="flex: 1 1 auto; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px">Tiểu thuyết mỏng</span>
            <span style="font-size: 12px; color: #9A9286">~100 trang · 30–60 chương</span>

      </div>

    <section aria-labelledby="mgv" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="mgv" style="margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9A9286; font-weight: 600">Giọng văn · độ u tối</h2>
      <div role="radiogroup" aria-label="Giọng văn" style="display: flex; flex-wrap: wrap; gap: 6px">
        <button role="radio" aria-checked="true" style="height: 38px; padding: 0 13px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid #E0674B; background: rgba(212,85,58,.16); color: #F7D5CA">Trầm, lạnh</button>
        <button role="radio" aria-checked="false" style="height: 38px; padding: 0 13px; border-radius: 999px; font-size: 13px; border: 1px solid #3A3631; background: transparent; color: #D9D1C3">Trữ tình</button>
        <button role="radio" aria-checked="false" style="height: 38px; padding: 0 13px; border-radius: 999px; font-size: 13px; border: 1px solid #3A3631; background: transparent; color: #D9D1C3">Gai góc</button>

        <button role="radio" aria-checked="false" style="height: 40px; border: none; border-radius: 9px; font-size: 13.5px; font-weight: 600; background: transparent; color: #B5AC9E">Đậm</button>

    <span style="font-size: 12px; color: #9A9286; text-align: center">Ước tính cả truyện: chưa có ước tính</span>
