- key: do_thi
  label: Đô thị
  hint: Thành phố chật chội, đắt đỏ và đầy cơ hội, nơi tiền thuê nhà, công việc và quan hệ kéo nhau đi lên hoặc xuống.
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: that
  setup_brief: '- Thành phố là một hệ thống sống gồm khu phố, chung cư, văn phòng, quán xá, đường phố và dịch vụ; mỗi nơi có giá cả, giờ giấc, tầng lớp cư dân và luật ngầm riêng.

    - Mỗi truyện chọn một lõi khác nhau: lập nghiệp, tranh việc và thăng chức, khởi nghiệp, thuê hoặc mua nhà, buôn bán nhỏ, nghề sáng tạo, nghề dịch vụ hoặc chen chân vào một giới nghề.

    - Xung đột đến từ tiền bạc có con số cụ thể, thời hạn, đồng nghiệp cạnh tranh, chủ nhà, khách hàng, đối tác và mạng quan hệ; cơ hội luôn kèm điều kiện.

    - Nhân vật chính đang leo lên hoặc bị đẩy xuống: nhân viên mới, chủ quán nhỏ, người làm tự do, tài xế công nghệ, nhà sáng tạo trẻ hoặc sinh viên mới ra trường.

    - Người xung quanh gồm bạn cùng phòng, cấp trên, đối thủ cùng nghề, khách quen, hàng xóm và người ở quê dõi theo; ai cũng có áp lực tiền bạc riêng.

    - Bí mật mang màu phố thị: điều khoản giấu trong hợp đồng, dự án bị đánh cắp, khoản nợ, quá khứ ở quê, danh tính trên mạng hoặc quan hệ lợi ích quanh một khu đất, một tòa nhà.

    - Cú lật thực tế: cơ hội vàng là bẫy nợ, đối thủ hóa ra cùng cảnh ngộ, dự án thắng nhờ dữ kiện nhỏ về khách hàng hoặc khu phố đã gieo, người nâng đỡ đòi một cái giá bất ngờ.

    - Cái giá đo được bằng tiền tiết kiệm, chỗ ở, sức khỏe, tình bạn và uy tín nghề; leo lên một bậc có thể làm mất chỗ đứng khác.

    - Kết chốt một vị trí mới trong thành phố: giữ được việc, nhà hoặc quán, đổi nghề, rời khu phố, hay lập được chỗ đứng riêng; nợ và hợp đồng chính giải quyết rõ.'
  outline_brief: '- Mỗi cảnh gắn với một nơi chốn và một giao dịch cụ thể: xin việc, chốt khách, trả giá thuê, họp hành, ra mắt sản phẩm hoặc xử lý sự cố.

    - Kết cảnh phải làm vị thế đổi rõ: tiền bạc, công việc, nhà ở, uy tín hoặc quan hệ của nhân vật chính không còn như trước.

    - Nhịp nhanh theo hạn chót: tiền nhà đến ngày, dự án đến buổi trình, quán đến giờ mở; việc chồng việc buộc nhân vật chính chọn ưu tiên.

    - Thành phố tham gia trực tiếp vào truyện: kẹt xe làm lỡ cơ hội, hàng xóm giữ manh mối, khách quen mang tin, khu phố đổi làm vận đổi.

    - Bí mật lộ qua hóa đơn, hợp đồng, tin nhắn công việc, lời khách hoặc người quen cũ; mỗi lần lộ làm thay đổi giá của một thỏa thuận.

    - Mỗi truyện chọn một đường áp lực khác nhau: đi lên rồi vấp, rơi xuống rồi gượng dậy, thắng liên tiếp nhưng cái giá dồn lại, hoặc đứng yên mà bị siết dần. Sức ép lớn dần qua tiền, thời hạn và đối thủ; ở khúc cuối, nhân vật chính dùng điều đã gieo (quan hệ, dữ kiện, tay nghề) để quyết định.

    - Chương cuối đặt vào buổi trình, ngày khai trương, phiên đàm phán hoặc hạn chót lớn nhất; kết quả tính bằng việc, nhà, tiền và người ở lại.'
  voice_brief: '- Nhanh, gọn và nhiều chi tiết phố: bảng hiệu, tiếng xe, thang máy, quán đông, thông báo công việc, mùi mưa trên đường nhựa.

    - Câu ngắn khi bận rộn, giao việc và thương lượng; câu chậm lại lúc tan ca khuya, mệt mỏi hoặc nhìn thành phố từ trên cao.

    - Đối thoại nghề nghiệp sắc và thực dụng: nói vòng để giữ giá, nói thẳng khi hết giờ; tiếng lóng nghề nghiệp dùng vừa đủ và rõ nghĩa qua ngữ cảnh.

    - Hài từ va chạm tầng lớp, hàng xóm, khách khó tính, bạn cùng phòng và những oái oăm của đời thuê nhà; không cười trên cảnh thiếu tiền của người khác.

    - Mỗi nhân vật có nhịp nói riêng: cấp trên dồn dập, chủ quán nhớ dai, bạn thân hay cà khịa, khách quen chậm rãi mà khó lường.'
- key: linh_di_dan_gian
  label: Kinh dị · linh dị dân gian
  hint: 'Làng quê, lệ làng, vật bị yểm và điều cấm kỵ: sợ từ những thứ quen thuộc nhất.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Linh dị dân gian: làng xóm, đình chùa, sông bãi, nghề cũ và lệ tục truyền miệng; điều lạ bám vào vật dụng, nhà cửa, tên gọi hay một nghi thức sai lệch.

    - Luật của cõi lạ phải nhất quán: mỗi hiện tượng có điều kiện xuất hiện, cách tránh và cái giá khi phạm kỵ; mỗi truyện chọn một hệ luật, không đổi giữa chừng.

    - Xung đột chọn khác nhau mỗi truyện: phá một lệ xấu, tìm vật thất lạc, minh oan cho người chết oan, hay ngăn gia đình lặp lại lỗi cũ.

    - Nhân vật chính là người trong cuộc bị buộc phải tìm hiểu, không phải thợ săn ma toàn năng; người già, họ hàng, hàng xóm mỗi người biết một mảnh và giấu một phần vì sợ, vì lợi hoặc xấu hổ.

    - Bí mật lộ dần qua lời kể mâu thuẫn, vật chứng cũ và hiện tượng lặp lại có biến đổi; cú lật có thể là ma giả người, người mượn chuyện ma, hoặc lệ làng vốn che một tội cũ.

    - Cái giá phải trả là mất niềm tin của người thân, mang tiếng phạm kỵ, đánh đổi vật kỷ niệm hoặc phải công khai bí mật nhà mình.

    - Kết gỡ hết luật lạ và nguồn gốc của nó: hóa giải, chôn lại đúng cách, nói thật trước làng họ hoặc phá bỏ lệ hại người.'
  outline_brief: '- Mỗi cảnh làm rõ một dấu hiệu lạ gắn với nơi chốn hay đồ vật cụ thể, đồng thời cho nhân vật chính lựa chọn: tin lệ cũ, làm trái, hay tìm chứng cứ trước.

    - Hiện tượng sau nặng và gần người hơn hiện tượng trước, nhưng luôn hé thêm một quy luật; không hù dọa ngẫu nhiên không liên quan bí mật.

    - Xen sinh hoạt làng quê yên bình để điều lạ nổi bật; manh mối nằm trong lời kể, gia phả, cúng giỗ, nghề cũ hay thói quen bị giấu.

    - Cao trào dồn nhân vật chính vào lúc phải chọn giữa tin lệ cũ và theo chứng cứ, với hậu quả thấy ngay; mỗi truyện chọn một kiểu: làm hay phá một nghi thức trước làng, đối diện một người biết rõ sự thật, mở lại nơi hay vật bị cấm, hoặc tự nhận lỗi để cắt vòng lặp.'
  voice_brief: '- Lạnh, ẩm và rờn rợn từ chi tiết quen: tiếng chó sủa khoảng không, bát hương tàn lệch, vệt nước không khô, tiếng gọi đúng tên giữa đêm.

    - Câu văn chậm, ít lời, nhiều khoảng lặng; khi điều lạ xuất hiện thì viết ngắn, dứt, không giải thích dông dài ngay.

    - Lời thoại mang giọng làng xóm: người già nói vòng, dặn nửa câu; người trẻ bướng, đùa che sợ; mỗi người có cách gọi và cách tránh gọi tên điều cấm kỵ.

    - Sợ bằng gợi ý và hậu quả thật, ít hù dọa rẻ tiền; thỉnh thoảng có câu đùa khô của người quê để thở rồi lại lạnh xuống.'
- key: tam_ly_toi_pham
  label: Tâm lý tội phạm
  hint: Đọc hành vi, lần vào suy nghĩ của kẻ gây án qua thẩm vấn và đàm phán trước lần gây án tiếp theo.
  styles:
  - prose
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Thế giới gồm hồ sơ hành vi, hiện trường, phòng thẩm vấn và những người bị tổn thương còn ở lại; suy đoán tâm lý luôn phải được chứng cứ vật chất kiểm chứng, không đọc vị bằng trực giác thần kỳ.

    - Mỗi truyện chọn một mạch: lần theo kẻ gây án lặp lại, đàm phán khi có người bị giữ, thẩm vấn nghi phạm chỉ nói dối một phần, hoặc lật lại vụ đã khép vì hồ sơ tính cách không khớp.

    - Nhân vật chính giỏi nhận ra mẫu hành vi lặp lại nhưng có một điểm mù từ trải nghiệm riêng, đồng đội thực địa và chuyên môn khác giữ chân suy đoán không bay xa.

    - Đối tượng có nhu cầu riêng chi phối hành vi: được công nhận, kiểm soát người khác, che một mối liên hệ, hoặc trốn một tội khác lớn hơn.

    - Bí mật nằm ở động cơ giả che động cơ thật, câu nói lặp lại vô tình, khoảng trống thời gian, hoặc mối liên hệ bị giấu với nạn nhân.

    - Cú lật có thể là hồ sơ đúng người nhưng sai thời điểm, kẻ tưởng đứng ngoài mới là trung tâm, hoặc lời thú nhận là màn che cho người khác.

    - Cái giá là thời gian khi đối tượng còn tự do, lòng tin của cả đội, và ranh giới nghề nghiệp khi nhân vật chính phải đồng cảm vừa đủ để đối thoại.

    - Kết là cuộc đối đầu bằng chứng cứ và hiểu đúng nhu cầu của đối tượng, gỡ hết mẫu hành vi đã gieo từ đầu.'
  outline_brief: '- Luân phiên hiện trường và hồ sơ, phỏng vấn người liên quan, thẩm vấn hoặc đàm phán, rồi hành động ngăn chặn dựa trên điều vừa suy ra.

    - Mỗi cảnh phải loại bỏ một giả thuyết bằng chi tiết cụ thể, hoặc thu hẹp hồ sơ thành một quyết định truy tìm hay bảo vệ rõ ràng.

    - Mỗi chương lộ một mẫu hành vi mới và đặt lại câu hỏi về động cơ; cao trào là cuộc đối thoại mà chứng cứ khóa dần đường lui của đối tượng.'
  voice_brief: '- Giọng lạnh, chính xác và căng ngầm; phân tích viết ngắn gọn, thuật ngữ được giải thích qua chi tiết hành vi thay vì chồng chất khái niệm.

    - Nhịp chậm trong phòng thẩm vấn với nhiều khoảng lặng, nhanh lên khi một chi tiết hồ sơ vừa khớp với hiện trường.

    - Lời thoại thẩm vấn dùng câu hỏi tưởng nhẹ mà khóa đường lui; đối tượng có giọng riêng, tự ái riêng và cách tự kể về mình rất riêng.

    - Sự lạnh nằm ở cách nhìn thẳng vào hành vi và hậu quả của nó với người ở lại; chọn chi tiết có ý nghĩa với suy luận thay vì dựng không khí cho đã.'
