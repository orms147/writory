- key: ky_ao_tu_tien
  label: Kỳ ảo · tu tiên
  hint: Tu luyện, tông môn và bí cảnh trong thế giới linh khí, nơi mỗi lần đột phá đều phải trả giá.
  styles:
  - prose
  - audio
  naming:
    names: han_viet
    places: hu_cau
  setup_brief: '- Thế giới có linh khí và các cảnh giới tu luyện phân bậc rõ ràng; tu luyện cần căn cơ, tài nguyên và thời gian, thuật pháp có giới hạn cùng phản phệ.

    - Mỗi truyện chọn một lõi khác nhau: tông môn tranh đoạt, bí cảnh săn bảo, yêu ma xâm lấn, luyện đan luyện khí, thiên kiếp hoặc ân oán giữa các giới.

    - Xung đột sinh từ tài nguyên khan hiếm, thứ bậc tông môn, môn quy, nợ nhân quả và khoảng cách sức mạnh; thắng bằng mưu, đồng minh hay đột phá đều tốn kém.

    - Nhân vật chính khởi đầu yếu thế: căn cơ kém, xuất thân thấp, công pháp khiếm khuyết, mất tu vi hoặc giữ dị bảo bị săn đuổi.

    - Đồng hành và đối thủ gồm sư hữu, trưởng bối có ẩn tình, thiên tài kiêu ngạo, thương nhân rành thế sự, linh thú hoặc tàn hồn khó đoán.

    - Bí mật xoay quanh thân thế, nguồn gốc công pháp, pháp bảo, kiếp nạn hoặc lời tiên tri; cú lật có thể biến bảo vật thành gông, ân nhân thành người gieo kiếp, cảnh giới cao thành cái bẫy.

    - Cái giá phải cụ thể: thọ nguyên, tu vi, ký ức, đạo tâm, quan hệ sư môn hoặc an nguy của người thân; đột phá càng lớn, mất mát càng rõ.

    - Kết có thể là phi thăng nhưng bỏ lại điều quý, phá luật cũ để lập đạo riêng, ở lại trấn giữ tông môn, hoặc thắng kẻ thù rồi từ chối con đường cũ.'
  outline_brief: '- Mỗi cảnh đẩy tu luyện hoặc cục diện tiến một bước cụ thể: được hay mất linh thạch, đan dược, tư cách dự tuyển, một bậc tu vi, một đồng minh.

    - Leo thang theo bậc: thử thách trong môn phái, tranh đoạt bên ngoài, bí cảnh và thiên kiếp; sau mỗi thắng lợi xuất hiện hậu quả hoặc đối thủ mạnh hơn.

    - Cảnh tu luyện phải có lựa chọn và rủi ro: chọn công pháp, dùng đan, độ kiếp, cứu người giữa lúc đột phá; không chỉ ngồi thiền rồi mạnh lên.

    - Manh mối về bí mật lộ qua tàn tịch, dị tượng, lời nói nửa vời, phản ứng của pháp bảo; trước cú lật lớn luôn có dấu hiệu nhỏ hợp lý.

    - Trận đấu làm rõ khoảng cách cảnh giới, điều kiện chiêu thức và cái giá; thắng nhờ chuẩn bị, địa hình, phối hợp hoặc điểm yếu đã gieo.

    - Chương cuối: đối mặt kiếp nạn hoặc kẻ thù gốc rễ bằng chính cái giá đã tích lũy; cảnh giới, vật phẩm và nợ nhân quả chốt rõ.'
  voice_brief: '- Hùng tráng và linh động, giàu hình ảnh trời đất, linh khí, lửa đan, kiếm quang; cảnh tĩnh có sương núi, tiếng chuông, mùi hương và dược liệu.

    - Lúc tu luyện câu văn chậm, dồn nén; lúc đấu pháp câu ngắn, mạnh, động từ sắc; tránh liệt kê chiêu thức mà không gây hậu quả.

    - Lời thoại giữ tôn ti sư môn, khách sáo ngoài mặt và châm chọc ngầm; trưởng bối nói ít ẩn ý, đối thủ kiêu ngạo lộ tham vọng qua lời.

    - Hài nhẹ từ chênh lệch phàm và tiên, linh thú, tình cảnh sư huynh đệ; không phá không khí ở lúc độ kiếp hay sinh tử.

    - Mỗi nhân vật có kiểu nói riêng: sư phụ kiệm lời, đồng môn thẳng thắn, đối thủ nho nhã độc địa, thương nhân luôn quy mọi thứ ra giá.'
- key: co_trang
  label: Cổ trang
  hint: Triều đình, gia tộc và giang hồ thời xưa, nơi mưu trí, lễ giáo và danh phận quyết định thắng thua.
  styles:
  - prose
  - audio
  naming:
    names: han_viet
    places: hu_cau
  setup_brief: '- Thế giới xưa hư cấu gồm triều đình, phủ đệ, gia tộc, chợ búa và giang hồ, vận hành bằng lễ giáo, thứ bậc, gia pháp, luật triều và danh tiếng.

    - Quyền lực đi qua hôn ước, quan hệ, ấn tín, sổ sách, nhân chứng và ân nghĩa; một lời đồn hay một lần thất lễ cũng có thể làm mất minh hữu.

    - Mỗi truyện chọn một lõi khác nhau: tranh quyền trong nhà, mưu lược triều đường, phá án quan phủ, ân oán giang hồ, thương hội, chiến sự biên cương hoặc hành trình xa xứ.

    - Xung đột chủ yếu bằng mưu trí, chứng cứ, thế lực và thời cơ; bạo lực chỉ là nước cuối khi lễ, luật và quan hệ đều đã gãy.

    - Nhân vật chính thường ở thế kẹt: con thứ, người mới về làm dâu hoặc rể, quan nhỏ, thị vệ, người hành y, thương hộ hay hiệp khách bị ràng buộc ân nghĩa.

    - Bí mật quanh thân phận, di thư, ấn tín, thư tín, hôn ước cũ, sổ sách tham ô hoặc vụ việc bị chôn; cú lật khiến người giữ lễ nhất hóa ra là kẻ phá lễ.

    - Cú lật khác có thể là minh chứng tưởng giả lại thật, ân nhân đòi một món nợ khác, hoặc nhân chứng trung thành nhất đang bảo vệ bí mật của chính mình.

    - Cái giá gồm danh dự, tự do hôn nhân, chức vị, tình thân và an nguy gia tộc; thắng bằng mưu vẫn có thể mất người hoặc mất đường lui.

    - Kết có thể là rửa oan và nắm quyền, rời khỏi phủ hoặc triều đình, vạch mặt chủ mưu trước nhiều người, hay giữ được gia tộc nhưng tự buộc mình vào vị trí mới.'
  outline_brief: '- Mỗi cảnh làm cán cân quyền lực đổi cụ thể: được ban hôn, mất quyền quản gia, được triệu kiến, bị giáng chức, thêm nhân chứng hoặc mất vật chứng.

    - Nhịp mưu lược gồm gieo tin, thử lòng, đặt bẫy và phản bẫy; trước khi ra đòn, nhân vật chính phải thu đủ người, vật chứng hoặc thời cơ.

    - Tiệc, lễ, buổi chầu và gia đường là chiến trường: chỗ ngồi, món dâng, thứ tự nói và sự im lặng đều là tín hiệu.

    - Bí mật lộ từng lớp qua thư, sổ sách, lời khai lệch nhau và vật dụng cũ; mỗi lớp mở thêm nguy cơ cho người đang giữ bí mật.

    - Cao trào đặt ở nơi đủ nhân chứng như công đường, gia đường, tiệc lớn hoặc trước cổng phủ, để kẻ chủ mưu không thể rút lại hậu quả.

    - Chương cuối: vật chứng và nhân chứng xuất hiện theo thứ tự khóa chặt lời chối; hôn ước, sổ sách, chức vị và người ra đi được chốt rõ.'
  voice_brief: '- Trang trọng, cổ kính vừa phải và dễ hiểu; dùng áo mũ, trà, sân phủ, đèn, mưa trên hiên và lễ nghi để tạo không khí, không sa đà vào từ khó.

    - Câu văn điềm đạm khi đấu lễ, căng và sắc khi đấu trí; cảm xúc thường nén sau kính ngữ, ẩn ý và những khoảng im lặng.

    - Đối thoại phân biệt bậc trên và kẻ dưới, người nhà và người ngoài; một cách xưng hô đổi khác hay một câu thất thố cũng báo hiệu biến cố.

    - Sự châm biếm lạnh đi qua lễ nghi: cười mà không ấm, khen mà như dao, ban thưởng mà là giáng họa.

    - Mỗi nhân vật có giọng riêng: trưởng bối chậm rãi uy quyền, thiếu gia hoặc tiểu thư sắc sảo, quản gia kín kẽ, hiệp khách thẳng và thô.'
- key: lich_su
  label: Lịch sử
  hint: Sống giữa một thời kỳ có thật, làm người nhỏ bé mà lựa chọn vẫn chạm vào biến cố lớn.
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: that
  setup_brief: '- Bối cảnh là một thời kỳ, một vùng và một biến cố có thật được chọn làm khung; đời sống vật chất, luật lệ, giao thông, tin tức, tiền bạc và nghề nghiệp phải đúng nhịp thời đó.

    - Mỗi truyện chọn một lõi khác nhau: chiến loạn, thiên tai, cải cách, thương lộ, di cư, xây dựng, kháng cự hoặc đời thường giữa đổi thay.

    - Sự kiện lớn là áp lực đè lên đời người, không phải bài giảng; kiến thức thời đại phải hiện qua việc làm, vật dụng, giá cả và nỗi lo cụ thể.

    - Nhân vật chính là người hư cấu ở vị trí nhỏ mà thật: lính, thư lại, thợ, lái buôn, nông dân, học trò, người đưa tin hoặc người chăm sóc thương bệnh.

    - Lựa chọn của họ cứu được người, việc hoặc chứng tích cụ thể, không dễ dàng đổi cả dòng lịch sử đã định.

    - Xung đột đến từ thiếu thốn, mệnh lệnh trái lương tâm, chia rẽ trong làng xã và gia đình, tin đến chậm, quyền lực ở xa; đối thủ cũng có lý do sống còn của thời thế.

    - Bí mật là phần bị bỏ quên: lá thư không tới, danh sách bị mất, người đổi tên, chứng tích bị chôn, lời kể của người trong cuộc khác lời kể chính thức.

    - Cú lật đặt lại ý nghĩa biến cố qua góc người nhỏ: kẻ bị coi là bỏ trốn đã quay lại cứu người, vật vô giá trị là chứng cứ, mệnh lệnh tưởng đúng xuất phát từ tin sai.

    - Cái giá gồm ly tán, mất nghề, mất quê, thương tích, hoặc phải chọn giữa gia đình và nghĩa vụ; thắng lợi thường là giữ được người hay sự thật cho mai sau.

    - Kết bám sát hệ quả của thời kỳ đã chọn: người sống sót đi đâu, chứng tích còn hay mất, tên tuổi được nhớ hay bị quên.'
  outline_brief: '- Mỗi cảnh gắn một việc đời thường với sức ép thời đại: bữa ăn, chuyến đi, ca trực, buổi chợ, lá thư hoặc lần điểm danh.

    - Nhịp chậm mà dồn: tin tức đến muộn, đường đi bị cắt, nguồn lực vơi dần; nhân vật chính phải quyết định khi thông tin chưa đủ và thời hạn đang tới.

    - Mốc lịch sử bước vào truyện qua lệnh ban, đoàn người đi qua, giá cả thay đổi, tiếng đồn được kiểm chứng hoặc vật dụng quen thuộc bỗng khan hiếm.

    - Chứng tích và nhân chứng được gieo sớm, có thể bị mất, hỏng hoặc giành giật; bí mật chỉ lộ khi nhân vật trả giá để tìm hay giữ nó.

    - Cao trào để biến cố lớn chạm đỉnh cùng lựa chọn riêng của nhân vật chính, không tách việc nước khỏi việc nhà.

    - Chương cuối: rõ ai sống sót, ai ra đi, chứng tích vào tay ai và điều gì được nhớ lại; khép đời nhân vật trong dòng thời cuộc.'
  voice_brief: '- Trầm, chân thực và giàu chi tiết đời sống: mùi khói, đường đất, áo vá, bữa ăn thiếu thốn, tiếng trống, tiếng loa hoặc tiếng người gọi nhau tùy thời.

    - Câu văn chắc, ít hoa mỹ; lúc biến cố dồn dập, câu ngắn theo nhịp chạy, chờ đợi và nghe ngóng.

    - Lời thoại đúng thân phận và thời đại: người già nói khác quan lại, lính nói khác lái buôn, mệnh lệnh khác hẳn tin đồn.

    - Cảm xúc nén trong hành động và chi tiết nhỏ: gói thêm phần ăn, giữ lại một cái tên, quay lại tìm người; ít khi tuyên bố lớn.

    - Thông tin thời đại lồng trong tranh cãi, hướng dẫn công việc và lựa chọn sinh tồn, tránh thuyết minh khô tách khỏi cảnh.'
- key: trinh_tham
  label: Trinh thám
  hint: 'Theo dấu manh mối, lật mặt thủ phạm bằng suy luận công bằng: mọi lời giải đều đã được gieo từ trước.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: that
  setup_brief: '- Bối cảnh đời thường chứa một vụ việc cần lời giải; quy mô, thủ đoạn và hậu quả phải nhất quán với nghề nghiệp, nơi chốn và quan hệ của những người liên quan.

    - Mỗi truyện chọn một loại vụ khác nhau: mất tích, trộm cắp, giả mạo danh tính, tống tiền, gian lận, tai nạn bị dàn dựng hoặc án mạng.

    - Người điều tra có thể là cảnh sát, thám tử tư, nhà báo, luật sư, nhân viên bảo vệ hoặc người thường bị cuốn vào; kỹ năng, nguồn tin và giới hạn quyền hạn phải rõ.

    - Nghi phạm là một nhóm có quan hệ chồng chéo; mỗi người có động cơ, cơ hội, phương tiện và một điều giấu riêng, kẻ vô tội cũng có thể nói dối vì lý do khác.

    - Manh mối phải công bằng: vật chứng, thời gian biểu, lời khai, thói quen và dấu vết được gieo trước khi dùng; manh mối giả có cách giải thích hợp lý khi nhìn lại.

    - Bí mật xoay quanh danh tính thật, mối quan hệ bị giấu, thời gian bị bẻ, vật chứng đổi tay hoặc hung thủ chính là người đang giúp điều tra.

    - Cú lật lớn nhất đổi ý nghĩa của manh mối đầu tiên, khiến những chi tiết tưởng vụn vặt bỗng khóa lại thành một chuỗi.

    - Cái giá gồm bị đe dọa, nghi oan người vô tội, mất chứng cứ, mất lòng tin của người thân, hoặc phải chọn giữa phơi bày sự thật và bảo vệ một người.

    - Kết phải khép kín: thủ phạm lộ diện bằng chuỗi chứng cứ, động cơ khớp hành động, các bí mật phụ được giải thích và không để manh mối chính treo lơ lửng.'
  outline_brief: '- Mỗi cảnh làm một việc điều tra cụ thể: tìm manh mối, loại một nghi phạm, xác minh lời khai, hoặc làm một giả thuyết sụp đổ.

    - Nhịp gồm hiện trường và câu hỏi, phỏng vấn thử lòng, chứng cứ lệch, nguy cơ mới rồi suy luận lại từ đầu; không để điều tra đi vòng không tiến triển.

    - Hỏi cung là đấu trí: câu hỏi dồn theo chi tiết đã biết, nghi phạm lộ qua sửa lời, nhớ quá rõ hoặc quên đúng chỗ.

    - Không ai tự thú khi chưa bị chứng cứ khóa; vật chứng luôn rõ ai giữ, ở đâu, ai đã chạm vào, thời gian và khoảng cách nhất quán.

    - Trước cao trào, nhân vật chính ráp các mảnh thành một giả thuyết có thể sai và phải trả giá nếu phán đoán sai.

    - Cao trào là đối chất hoặc đặt bẫy buộc thủ phạm tự lộ bằng hành động mới, không chỉ ngồi nghe giải thích.

    - Chương cuối: chuỗi suy luận được trình bày gọn qua chứng cứ và đối đầu, thủ phạm chịu hậu quả cụ thể, mọi manh mối giả đều được gỡ.'
  voice_brief: '- Lạnh, tỉnh và căng ngầm; chi tiết được nhìn bằng con mắt điều tra: vị trí đồ vật, một câu chữ lạ, phản ứng chậm một nhịp.

    - Câu ngắn khi quan sát và cao trào, câu vừa khi suy luận; mỗi lần nhắc lại vụ việc phải thêm nghĩa mới, không thuật lại nguyên vẹn.

    - Đối thoại là thẩm vấn và né tránh: hỏi cụt, đáp vòng, im lặng có ý; mỗi nghi phạm có một kiểu nói dối riêng.

    - Hài khô rất ít, đến từ sự mệt mỏi của người điều tra hoặc người đồng hành; không đùa cợt trên thiệt hại của nạn nhân.

    - Không khí tạo bằng âm thanh và khoảng trống: hành lang vắng, phòng chờ, quán khuya, tiếng bước chân, cuộc gọi bị ngắt; hồi hộp nằm ở điều chưa nói.'
- key: do_thi
  label: Đô thị
  hint: Thành phố chật chội, đắt đỏ và đầy cơ hội, nơi tiền thuê nhà, công việc và quan hệ kéo nhau đi lên hoặc xuống.
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: that
  setup_brief: '- Thành phố là một hệ thống sống gồm khu phố, chung cư, văn phòng, quán xá, đường phố và dịch vụ; mỗi nơi có giá cả, giờ giấc, tầng lớp cư dân và luật ngầm riêng.

    - Mỗi truyện chọn một lõi khác nhau: lập nghiệp, tranh việc và thăng chức, khởi nghiệp, thuê hoặc mua nhà, buôn bán nhỏ, nghề sáng tạo, nghề dịch vụ hoặc chen chân vào một giới nghề.

    - Xung đột đến từ tiền bạc có con số cụ thể, thời hạn, đồng nghiệp cạnh tranh, chủ nhà, khách hàng, đối tác và mạng quan hệ; cơ hội luôn kèm điều kiện.

    - Nhân vật chính đang leo lên hoặc bị đẩy xuống: nhân viên mới, chủ quán nhỏ, người làm tự do, tài xế công nghệ, nhà sáng tạo trẻ hoặc sinh viên mới ra trường.

    - Người xung quanh gồm bạn cùng phòng, cấp trên, đối thủ cùng nghề, khách quen, hàng xóm và người ở quê dõi theo; ai cũng có áp lực tiền bạc riêng.

    - Bí mật mang màu phố thị: điều khoản giấu trong hợp đồng, dự án bị đánh cắp, khoản nợ, quá khứ ở quê, danh tính trên mạng hoặc quan hệ lợi ích quanh một khu đất, một tòa nhà.

    - Cú lật thực tế: cơ hội vàng là bẫy nợ, đối thủ hóa ra cùng cảnh ngộ, dự án thắng nhờ dữ kiện nhỏ về khách hàng hoặc khu phố đã gieo, người nâng đỡ đòi một cái giá bất ngờ.

    - Cái giá đo được bằng tiền tiết kiệm, chỗ ở, sức khỏe, tình bạn và uy tín nghề; leo lên một bậc có thể làm mất chỗ đứng khác.

    - Kết chốt một vị trí mới trong thành phố: giữ được việc, nhà hoặc quán, đổi nghề, rời khu phố, hay lập được chỗ đứng riêng; nợ và hợp đồng chính giải quyết rõ.'
  outline_brief: '- Mỗi cảnh gắn với một nơi chốn và một giao dịch cụ thể: xin việc, chốt khách, trả giá thuê, họp hành, ra mắt sản phẩm hoặc xử lý sự cố.

    - Kết cảnh phải làm vị thế đổi rõ: tiền bạc, công việc, nhà ở, uy tín hoặc quan hệ của nhân vật chính không còn như trước.

    - Nhịp nhanh theo hạn chót: tiền nhà đến ngày, dự án đến buổi trình, quán đến giờ mở; việc chồng việc buộc nhân vật chính chọn ưu tiên.

    - Thành phố tham gia trực tiếp vào truyện: kẹt xe làm lỡ cơ hội, hàng xóm giữ manh mối, khách quen mang tin, khu phố đổi làm vận đổi.

    - Bí mật lộ qua hóa đơn, hợp đồng, tin nhắn công việc, lời khách hoặc người quen cũ; mỗi lần lộ làm thay đổi giá của một thỏa thuận.

    - Leo thang từ thắng nhỏ ở một nơi, bị cạnh tranh lớn hơn để ý, mất tiền hoặc uy tín, rồi dùng mạng lưới đã xây để đánh nước cờ cuối.

    - Chương cuối đặt vào buổi trình, ngày khai trương, phiên đàm phán hoặc hạn chót lớn nhất; kết quả tính bằng việc, nhà, tiền và người ở lại.'
  voice_brief: '- Nhanh, gọn và nhiều chi tiết phố: bảng hiệu, tiếng xe, thang máy, quán đông, thông báo công việc, mùi mưa trên đường nhựa.

    - Câu ngắn khi bận rộn, giao việc và thương lượng; câu chậm lại lúc tan ca khuya, mệt mỏi hoặc nhìn thành phố từ trên cao.

    - Đối thoại nghề nghiệp sắc và thực dụng: nói vòng để giữ giá, nói thẳng khi hết giờ; tiếng lóng nghề nghiệp dùng vừa đủ và rõ nghĩa qua ngữ cảnh.

    - Hài từ va chạm tầng lớp, hàng xóm, khách khó tính, bạn cùng phòng và những oái oăm của đời thuê nhà; không cười trên cảnh thiếu tiền của người khác.

    - Mỗi nhân vật có nhịp nói riêng: cấp trên dồn dập, chủ quán nhớ dai, bạn thân hay cà khịa, khách quen chậm rãi mà khó lường.'
- key: hien_dai
  label: Hiện đại
  hint: Đời sống hôm nay với công việc, gia đình, tình cảm và những lựa chọn rất người, rất gần.
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Bối cảnh là đời sống hôm nay trong gia đình, trường học, cơ quan, khu dân cư, thị trấn hoặc cộng đồng mạng quen thuộc; ràng buộc chính là tiền, thời gian, kỳ vọng, sĩ diện và trách nhiệm.

    - Mỗi truyện chọn một lõi khác nhau: tình cảm và hôn nhân, gia đình nhiều thế hệ, tình bạn, sự nghiệp đầu đời, học đường, làm cha mẹ, chăm người già hoặc bắt đầu lại sau đổ vỡ.

    - Xung đột thường không có kẻ hoàn toàn sai: giữ hay buông một mối quan hệ, gần hay xa gia đình, chọn ổn định hay ước mơ, nói thật hay giữ hòa khí.

    - Nhân vật chính có đời sống cụ thể gồm nghề nghiệp, thu nhập, thói quen, người thân và một thiếu sót khiến họ tự làm khó mình.

    - Người xung quanh có đời riêng, nỗi lo riêng và cách thương yêu riêng; không ai chỉ tồn tại để khuyên nhủ nhân vật chính.

    - Bí mật gần gũi gồm chuyện gia đình bị giấu, tin nhắn chưa gửi, món nợ không nói ra, bệnh tình, quá khứ của một mối quan hệ hoặc dự định rời đi.

    - Cú lật đổi cách hiểu một con người: người tưởng vô tâm đã âm thầm gánh vác, lời nói dối để bảo vệ thành gánh nặng, cơ hội tưởng cứu rỗi lại buộc phải rời xa.

    - Cái giá là một mối quan hệ rạn nứt, cơ hội nghề nghiệp, lòng tin hoặc thời gian bên người thân; trưởng thành thể hiện bằng chịu hậu quả thay vì được tha thứ ngay.

    - Kết đời thường mà dứt khoát: ở lại hay rời đi, nói ra hay khép lại, đặt ranh giới mới; các quan hệ chính có trạng thái rõ, không kết bằng một bài học suông.'
  outline_brief: '- Mỗi cảnh là một sinh hoạt có việc cần giải quyết: bữa cơm, buổi họp, chuyến thăm, ngày làm việc, cuộc hẹn hoặc việc nhà; dưới việc nhỏ là căng thẳng chưa nói.

    - Nhịp cảm xúc đi từ tránh né, va chạm nhỏ, bí mật lộ một phần, lựa chọn làm tổn thương ai đó, đến đối thoại thật hoặc hành động bù đắp.

    - Đối thoại và hành động thay phiên hé lộ quá khứ; để tin nhắn, vật dụng, thói quen và người thứ ba đưa quá khứ bước vào hiện tại.

    - Mỗi bước ngoặt làm ít nhất một quan hệ đổi trạng thái: thân thành xa, xa thành hiểu, tin thành nghi, nợ nần thành trả xong; đổi thay phải do lựa chọn trong cảnh gây ra.

    - Cao trào là cuộc đối thoại hoặc quyết định bị dồn đến không tránh được, dùng chi tiết tính cách đã gieo thay vì thêm biến cố lạ phút chót.

    - Chương cuối: một sinh hoạt quen thuộc lặp lại nhưng cách nhân vật chính hành xử đã khác; kết quả hiện qua việc làm, người ở lại và khoảng cách mới.'
  voice_brief: '- Gần gũi, tự nhiên và giàu chi tiết nhỏ: mâm cơm, tin nhắn chờ trả lời, áo đang phơi, chuyến xe, giờ tan làm; cảm xúc nằm trong chi tiết, không tuyên ngôn.

    - Câu văn mềm, nhịp vừa; khi cãi nhau câu ngắn và ngắt quãng, khi thân mật để im lặng và cử chỉ thay những lời thừa nhận dài.

    - Đối thoại đúng đời thường: nói nửa câu, đổi chủ đề, đùa để tránh nặng nề; người nhà, bạn bè và đồng nghiệp mỗi kiểu một khác.

    - Hài nhẹ và ấm từ thói quen, tính cách, những hiểu lầm nhỏ; lúc buồn giữ lặng, không chen đùa làm loãng cảm xúc.

    - Mỗi nhân vật có cách quan tâm riêng bằng hành động: nấu ăn, đưa đón, nhớ lịch, để phần, giả vờ không để ý; ít nói lời lớn.'
- key: tuong_lai
  label: Tương lai giả tưởng
  hint: Công nghệ và xã hội của ngày mai đặt con người trước những lựa chọn chưa từng có tiền lệ.
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Thế giới tương lai xây quanh một hoặc hai tiền đề giả tưởng rõ ràng; mỗi truyện chọn khác nhau: trí tuệ nhân tạo, du hành vũ trụ, khí hậu biến đổi, thành phố thông minh, thực tế ảo, y học mới, thuộc địa xa hoặc xã hội bị giám sát.

    - Luật công nghệ phải nhất quán: khả năng, giới hạn, chi phí về năng lượng, dữ liệu hoặc cơ thể, và ai là người kiểm soát nó.

    - Công nghệ giải quyết một vấn đề đồng thời tạo ra vấn đề mới; hệ thống tưởng trung lập thường phục vụ lợi ích của một nhóm nào đó.

    - Xung đột đến từ khoảng cách giữa người được hưởng công nghệ và người bị nó định giá, thay thế, theo dõi hoặc bỏ lại.

    - Nhân vật chính chạm trực tiếp vào tiền đề: kỹ sư, phi công, bác sĩ, người vận hành, cư dân vùng bị bỏ, thanh tra hoặc người sống ngoài hệ thống.

    - Đồng hành có thể là người máy hoặc trí tuệ nhân tạo, nhưng phải có giới hạn, chức năng và động cơ riêng theo luật đã đặt, không toàn năng.

    - Bí mật gồm nguồn gốc một hệ thống, ký ức bị sửa, dữ liệu bị giấu, thí nghiệm cũ, con người đứng sau cỗ máy tự động, hoặc nơi ở không đúng như công bố.

    - Cú lật đổi câu hỏi của truyện: lỗi máy hóa ra là lựa chọn của người, sự sống tưởng nhân tạo mang ký ức thật, giải pháp cứu tất cả chỉ cứu được một nhóm.

    - Cái giá gồm ký ức, cơ thể, danh tính, quyền riêng tư, quê hương, hoặc quan hệ với người không cùng thời gian và dạng sống.

    - Kết có thể là đổi luật hệ thống, công khai hoặc phá hủy công nghệ, rời đến nơi mới, ở lại thích nghi với mất mát; tiền đề chính được khép bằng số phận nhân vật.'
  outline_brief: '- Mỗi cảnh cho công nghệ hoạt động trong một việc cụ thể và gây hậu quả: đi lại, chữa trị, làm việc, liên lạc hoặc sinh tồn; không dừng truyện để giảng giải.

    - Nhịp đi từ tiện ích gây tò mò, giới hạn hoặc lỗi nhỏ, hệ thống siết chặt, bí mật về người kiểm soát, đến lựa chọn không có đáp án sạch.

    - Khám phá thế giới qua nhiệm vụ và đường đi: vào nơi bị cấm, gặp nhóm người sống khác, thử công nghệ bằng chính cơ thể hoặc dữ liệu của mình.

    - Manh mối gieo bằng chi tiết kỹ thuật bất thường lặp lại, dữ liệu bị thiếu, lời của hệ thống và người vận hành mâu thuẫn nhau; cú lật suy ra được từ luật đã lập.

    - Cao trào buộc dùng tiền đề ở mức cực đoan: tắt hoặc bật hệ thống, đổi một ký ức, vượt giới hạn cơ thể, công khai dữ liệu; quyết định có thời hạn và khó đảo ngược.

    - Chương cuối: thế giới đổi một điều cụ thể sau quyết định và đời nhân vật chính đổi theo; công nghệ chính được trả lời, không bị bỏ quên.'
  voice_brief: '- Giàu hình ảnh mà rõ ràng: ánh sáng nhân tạo, không gian kín và mở, giao diện, âm thanh máy, thiên nhiên đã biến đổi; cái lạ luôn bám vào cảm giác của con người.

    - Câu văn mạch lạc khi tả công nghệ, ngắn và căng khi hệ thống báo động hoặc lựa chọn đến hạn; thuật ngữ mới dùng ít và hiểu được qua cách vận hành.

    - Đối thoại phân biệt người và hệ thống: máy nói chính xác, ít ngập ngừng; người nói vòng, đùa và giấu sợ hãi sau những câu quen miệng.

    - Không khí lạnh, cô đơn hoặc kỳ vĩ tùy tiền đề; hài khô từ va chạm giữa thói quen cũ và công nghệ mới.

    - Cảm xúc giữ rất người: nhớ nhà, sợ bị thay thế, thương một dạng sống lạ, tiếc một ký ức sắp mất; kỳ quan luôn gắn với mất mát hoặc lựa chọn cụ thể.'
- key: linh_di_dan_gian
  label: Kinh dị · linh dị dân gian
  hint: 'Làng quê, lệ làng, vật bị yểm và điều cấm kỵ: sợ từ những thứ quen thuộc nhất.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Linh dị dân gian: làng xóm, đình chùa, sông bãi, nghề cũ và lệ tục truyền miệng; điều lạ bám vào vật dụng, nhà cửa, tên gọi hay một nghi thức sai lệch.

    - Luật của cõi lạ phải nhất quán: mỗi hiện tượng có điều kiện xuất hiện, cách tránh và cái giá khi phạm kỵ; mỗi truyện chọn một hệ luật, không đổi giữa chừng.

    - Xung đột chọn khác nhau mỗi truyện: phá một lệ xấu, tìm vật thất lạc, minh oan cho người chết oan, hay ngăn gia đình lặp lại lỗi cũ.

    - Nhân vật chính là người trong cuộc bị buộc phải tìm hiểu, không phải thợ săn ma toàn năng; người già, họ hàng, hàng xóm mỗi người biết một mảnh và giấu một phần vì sợ, vì lợi hoặc xấu hổ.

    - Bí mật lộ dần qua lời kể mâu thuẫn, vật chứng cũ và hiện tượng lặp lại có biến đổi; cú lật có thể là ma giả người, người mượn chuyện ma, hoặc lệ làng vốn che một tội cũ.

    - Cái giá phải trả là mất niềm tin của người thân, mang tiếng phạm kỵ, đánh đổi vật kỷ niệm hoặc phải công khai bí mật nhà mình.

    - Kết gỡ hết luật lạ và nguồn gốc của nó: hóa giải, chôn lại đúng cách, nói thật trước làng họ hoặc phá bỏ lệ hại người.'
  outline_brief: '- Mỗi cảnh làm rõ một dấu hiệu lạ gắn với nơi chốn hay đồ vật cụ thể, đồng thời cho nhân vật chính lựa chọn: tin lệ cũ, làm trái, hay tìm chứng cứ trước.

    - Hiện tượng sau nặng và gần người hơn hiện tượng trước, nhưng luôn hé thêm một quy luật; không hù dọa ngẫu nhiên không liên quan bí mật.

    - Xen sinh hoạt làng quê yên bình để điều lạ nổi bật; manh mối nằm trong lời kể, gia phả, cúng giỗ, nghề cũ hay thói quen bị giấu.

    - Cao trào buộc nhân vật chính thực hiện hay phá một nghi thức trước nhiều người, với nguy cơ chọn sai thấy ngay.'
  voice_brief: '- Lạnh, ẩm và rờn rợn từ chi tiết quen: tiếng chó sủa khoảng không, bát hương tàn lệch, vệt nước không khô, tiếng gọi đúng tên giữa đêm.

    - Câu văn chậm, ít lời, nhiều khoảng lặng; khi điều lạ xuất hiện thì viết ngắn, dứt, không giải thích dông dài ngay.

    - Lời thoại mang giọng làng xóm: người già nói vòng, dặn nửa câu; người trẻ bướng, đùa che sợ; mỗi người có cách gọi và cách tránh gọi tên điều cấm kỵ.

    - Sợ bằng gợi ý và hậu quả thật, ít hù dọa rẻ tiền; thỉnh thoảng có câu đùa khô của người quê để thở rồi lại lạnh xuống.'
- key: mat_the_sinh_ton
  label: Mạt thế · sinh tồn
  hint: 'Thế giới sụp đổ, thiếu ăn thiếu thuốc: mỗi lựa chọn đổi bằng một thứ không lấy lại được.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Mạt thế sinh tồn: trật tự cũ sụp đổ vì một biến cố chọn riêng mỗi truyện như dịch bệnh lạ, thiên tai triền miên, cạn năng lượng hay sinh vật nguy hiểm lan tràn; luật sinh tồn và nguồn nguy phải rõ, nhất quán.

    - Thế giới thiếu thứ cụ thể: nước sạch, thuốc, điện, lương thực, nơi khô ráo; mỗi nơi an toàn đều có điều kiện và người giữ nó.

    - Xung đột thiên về giữ người hay giữ của, cứu người lạ hay đóng cửa, ở lại hay di chuyển; nhóm sống sót rạn vì nhu cầu và bí mật, không chỉ vì kẻ ác.

    - Nhân vật chính có một kỹ năng hữu ích nhưng giới hạn như sửa chữa, chăm sóc người bệnh, tìm đường, trồng trọt hay đàm phán, và một điểm yếu khiến họ phải dựa vào người khác.

    - Bí mật lộ dần: nguồn gốc biến cố, nơi an toàn thật giả, quá khứ của người đồng hành, hay thứ bị giấu trong kho; cú lật làm thay đổi giá trị của một nơi, một người hay một món đồ tưởng vô dụng.

    - Cái giá là bỏ lại đồ, nơi ở, mối quan hệ hoặc một phần sức khỏe; không lần nào thoát nạn mà không mất gì.

    - Kết chọn một kiểu: lập được chốn sống bền, đến được nơi đáng tin, hoặc phá được nguồn nguy gần nhất; người sống có kế hoạch sống tiếp rõ ràng.'
  outline_brief: '- Mỗi cảnh xoay quanh một nhu cầu cụ thể và một lựa chọn tốn kém: đi lấy gì, bỏ lại gì, tin ai, ai được dùng phần ít ỏi còn lại.

    - Nguy hiểm leo thang theo chuỗi hậu quả: quyết định trước làm cảnh sau khó hơn, đồ hư, người mệt, đường bị chặn; luôn rõ đồ đạc và thương tích còn mang theo.

    - Xen cảnh lặng: nấu bữa ít ỏi, sửa đồ, trực đêm, kể chuyện cũ; qua đó gắn kết nhóm và gieo manh mối.

    - Cao trào là một cuộc đi lấy thứ sống còn hoặc giữ chốn ở khi thời gian và tài nguyên cùng cạn.'
  voice_brief: '- Khô, thực tế, căng mà không khoa trương; nguy hiểm đến từ tiếng động nhỏ, mùi lạ, cơn sốt, mức nhiên liệu sắp cạn.

    - Câu ngắn khi hành động, câu dài mệt mỏi khi chờ đợi; lời thoại thực dụng, hay mặc cả, ít khẩu hiệu anh hùng.

    - Hài rất khô, hiếm, từ người mệt vẫn trêu nhau; ấm áp nằm ở chia phần ăn, nhường chỗ ngủ, nhớ tên nhau.

    - Miêu tả đồ vật bằng công dụng và tình trạng: còn dùng được bao lâu, hỏng ở đâu, đổi được gì.'
- key: vo_hiep_giang_ho
  label: Võ hiệp · giang hồ
  hint: 'Môn phái, ân oán và một chiêu thức thất truyền: danh tiếng đi trước người, nợ phải trả.'
  styles:
  - prose
  - audio
  naming:
    names: han_viet
    places: hu_cau
  setup_brief: '- Võ hiệp giang hồ: môn phái, bang hội, tiêu cục và cao thủ ẩn danh cùng giữ một trật tự dựa trên danh tiếng, môn quy và nợ ân tình.

    - Võ học có trường phái, khắc chế và giới hạn rõ: một chiêu mạnh phải tốn nội lực, cần điều kiện hoặc để lại sơ hở; nhân vật chính không thắng mọi đối thủ bằng sức mạnh suông.

    - Xung đột chọn khác nhau mỗi truyện: tranh bí kíp hay binh khí, rửa oan, bảo tiêu, trả nợ sư môn, ngăn hai phái tàn sát, giữ lời thề cũ.

    - Nhân vật chính ở thế yếu về võ công, thân phận hoặc danh tiếng, phải dùng quan sát, địa thế, lễ giang hồ và chọn đồng minh.

    - Bí mật lộ dần qua chiêu thức quen thuộc, vết thương cũ, tín vật, lời thề và cách người xưa xưng hô; cú lật có thể đổi kẻ thù thành người giữ lời hứa, sư phụ thành kẻ nợ cũ, bí kíp thành cái bẫy.

    - Cái giá là mang thương, mất danh, nợ một mạng ân tình, bị môn phái truy hoặc phải bỏ con đường yên ổn.

    - Kết bằng một trận quyết đấu, một cuộc đối chất trước giang hồ hoặc tha thứ có điều kiện; ân oán chính được trả, danh phận nhân vật chính được định lại.'
  outline_brief: '- Mỗi cảnh đẩy một món nợ giang hồ tới hạn: thách đấu, cứu người, giữ tín vật, phá giải một chiêu, hoặc chọn đứng về phía nào trước đám đông.

    - Cảnh đánh phải rõ ràng: khoảng cách, địa thế, chiêu ra sao, ai bị dồn vào đâu, thắng thua đổi bằng thương tích hay vị thế cụ thể.

    - Sau mỗi trận, hậu quả ở lại: vết thương, tiếng đồn, môn phái ghi sổ, người được cứu mang ơn; không đánh xong như chưa từng xảy ra.

    - Cao trào gom các món nợ và bí mật võ học vào một nơi, buộc nhân vật chính đấu bằng cả võ, trí và chữ tín.'
  voice_brief: '- Hào sảng, cổ kính vừa phải, dễ hiểu; câu văn nhanh khi giao đấu, chậm và trang trọng khi bái kiến, uống rượu, lập thệ.

    - Lời thoại có lễ, có gai: xưng hô theo vai vế, nói kính mà thách, châm chọc không thô; mỗi môn phái có cách nói và câu cửa miệng riêng.

    - Hài từ va chạm tính cách giang hồ: kẻ sĩ diện, lão ăn mày biết tuốt, cao thủ vụng việc nhà; không phá khí thế lúc sinh tử.

    - Chiêu thức có hình ảnh như gió, lá, chuông, nước nhưng luôn rõ ai trúng, ai tránh, ai mất thế.'
- key: ngon_tinh_hien_dai
  label: Ngôn tình · hiện đại
  hint: 'Hai người lớn va vào nhau giữa đời thường: rung động có thật, rào cản cũng có thật.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Ngôn tình hiện đại: tình cảm của nhân vật chính là trục chính, nảy sinh từ va chạm đời thường như công việc chung, hàng xóm, bạn cũ, đối tác khó ưa hay một lần giúp đỡ bất đắc dĩ.

    - Mỗi truyện chọn một rào cản chính khác nhau: khác mục tiêu sống, vết thương cũ, khoảng cách địa vị, gia đình hai bên, bí mật nghề nghiệp hoặc một lời hứa chưa dứt; rào cản phải đổi hành động, không chỉ gây hiểu lầm lặt vặt.

    - Hai người đều có đời riêng, điểm đáng mến và tật xấu cụ thể; sức hút đến từ cách họ tôn trọng, trêu chọc, làm việc và sửa sai, không chỉ từ ngoại hình hay giàu có.

    - Bí mật lộ dần qua thói quen, món đồ giữ lâu, người cũ, tin nhắn chưa gửi và điều họ tránh nói; cú lật làm hiểu lại một hành động tưởng lạnh lùng hay ích kỷ.

    - Cái giá để đến với nhau là thừa nhận nhu cầu thật, xin lỗi đúng việc, từ bỏ một cơ hội, đặt ranh giới với gia đình hoặc công khai mối quan hệ trước áp lực.

    - Kết tình cảm rõ ràng: chọn nhau với cách sống cụ thể, hoặc chia tay tử tế sau khi hiểu nhau; không kết bằng hiểu lầm treo lơ lửng.'
  outline_brief: '- Mỗi cảnh phải đổi mức quan hệ một nấc cụ thể: tin hơn, nợ nhau, ghen mà nhận ra, giận có lý, hay xa ra vì một lựa chọn thật.

    - Xen cảnh gần gũi nhỏ như ăn chung, đưa về, làm việc khuya, chăm lúc ốm với cảnh va chạm giá trị; chi tiết lặp lại của hai người thành dấu hiệu riêng.

    - Không kéo dài hiểu lầm chỉ vì không chịu nói một câu; khi giấu, phải có lý do và hậu quả, và sự thật hé từng phần.

    - Cao trào buộc nhân vật chính chọn giữa tình cảm và một thứ họ từng đặt trên hết, rồi chịu hậu quả của lựa chọn ấy.'
  voice_brief: '- Ấm, dí dỏm, gần gũi; rung động qua chi tiết nhỏ: nhớ cách uống cà phê, tin nhắn gõ rồi xóa, áo khoác cho mượn, im lặng đúng lúc.

    - Lời thoại trêu chọc có duyên, cãi nhau nói đúng vấn đề; lúc nghiêm túc thì ngắn, thật, không sến súa triết lý.

    - Câu văn mềm khi gần, nhanh và cộc khi tự vệ; hài từ bạn bè, đồng nghiệp và gia đình hai bên.

    - Gần gũi viết bằng ánh mắt, khoảng lặng, bàn tay ngập ngừng và những câu nói chưa hết; cảm xúc đi trước lời tỏ tình.'
- key: trong_sinh_lam_lai
  label: Trọng sinh · làm lại đời
  hint: 'Sống lại với ký ức đời trước: biết trước một đoạn đường, nhưng đời đã rẽ khác.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Trọng sinh làm lại đời: nhân vật chính tỉnh lại ở một thời điểm cũ, mang ký ức đời trước; mỗi truyện chọn điểm trở về và nguyên nhân tiếc nuối riêng.

    - Ký ức chỉ đúng một phần: nhớ kết quả lớn nhưng quên chi tiết, nhớ người nhưng không biết lòng người đã đổi; mỗi lần dùng ký ức là một lần kiểm chứng.

    - Xung đột chọn khác nhau mỗi truyện: tránh một tai họa, cứu một mối quan hệ, sửa lựa chọn nghề nghiệp, giữ tài sản, minh oan, hay buông thứ đời trước theo đuổi đến kiệt sức.

    - Nhân vật phụ không phải quân cờ: họ phản ứng khác khi nhân vật chính đổi cách sống, có người nghi ngờ, có người được cứu lại rẽ hướng mới.

    - Bí mật lộ dần: đời trước nhân vật chính hiểu sai điều gì, ai đã âm thầm giúp hay hại, và vì sao một biến cố thật sự xảy ra; cú lật làm ký ức tưởng chắc chắn sụp xuống.

    - Cái giá là càng sửa đời càng mất lợi thế biết trước, phải xa người từng thân, mang tiếng thay đổi thất thường hoặc đối mặt hậu quả mình gây ra ở đời mới.

    - Kết đời mới đứng vững bằng lựa chọn và năng lực thật, không chỉ nhờ biết trước; tiếc nuối chính được hóa giải hoặc chấp nhận.'
  outline_brief: '- Mỗi cảnh đặt ký ức đời trước cạnh hiện tại: một dấu hiệu quen, một điểm đã khác, nhân vật chính phải chọn tin ký ức hay tin người trước mặt.

    - Lợi thế biết trước cho thắng lợi nhỏ sớm, rồi biến số mới xuất hiện khiến kế hoạch phải làm lại; không thắng liên tục nhờ thuộc bài.

    - Manh mối đời trước hé qua gặp lại người cũ, vật cũ, ngày tháng sắp tới; mỗi lần hé, một hiểu lầm cũ được soi lại.

    - Cao trào đến vào thời điểm của biến cố lớn đời trước, nhưng nguyên nhân và người liên quan đã khác vì những gì nhân vật chính đã đổi.'
  voice_brief: '- Hai lớp cảm xúc chồng nhau: việc bình thường cũng gợi vui buồn vì đã từng mất; giọng kể tỉnh táo mà hay khựng lại một nhịp.

    - Câu văn rõ, nhanh khi nhân vật chính tranh thủ thời cơ; chậm, nghèn nghẹn khi gặp lại người đời trước tưởng không còn gặp được.

    - Lời thoại đời này nói một đằng, lòng hiểu một nẻo; nhân vật chính hay nói trước điều người khác sắp nói rồi phải chữa lời.

    - Hài nhẹ từ sự lệch thời: biết quá nhiều về người mới quen, nhớ nhầm thói quen chưa hình thành, già dặn quá tuổi.'
- key: he_thong_tro_choi
  label: Hệ thống · như trò chơi
  hint: 'Nhiệm vụ, cấp bậc và phần thưởng hiện trước mắt: lên cấp thật, cái giá cũng thật.'
  styles:
  - prose
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Hệ thống như trò chơi: nhân vật chính nhận một hệ thống chỉ họ thấy, giao nhiệm vụ, thưởng phạt và mở dần khả năng; luật phải rõ: điều kiện nhận, khi nào thưởng, khi nào phạt, giới hạn mỗi lần dùng.

    - Mỗi truyện chọn nguồn và mục đích khác nhau cho hệ thống: thử thách của ai đó, công cụ sinh tồn, di sản bị khóa, hay một cuộc chơi có kẻ đứng sau; mục đích thật là bí mật lớn.

    - Xung đột đến từ nhiệm vụ trái mong muốn, phần thưởng cám dỗ, đối thủ cũng có lợi thế riêng, và đời thật không vận hành như trò chơi: lòng tin mất đi khó lấy lại.

    - Nhân vật chính khởi đầu yếu, phải chọn nâng một hướng chính như sức, trí, nghề, quan hệ hay khám phá; không nâng được tất cả, mỗi lựa chọn khóa bớt đường khác.

    - Bí mật lộ dần qua nhiệm vụ bất thường, phần thưởng quá hậu, lỗi hệ thống và dấu vết nhiệm vụ của người khác; cú lật có thể là hệ thống đang chọn lọc, huấn luyện, lợi dụng hay bảo vệ nhân vật chính.

    - Cái giá khi lạm dụng là phạt cụ thể, mất kỹ năng, lộ bí mật, nợ hệ thống hoặc biến người thân thành một phần của nhiệm vụ.

    - Kết gỡ hết mục đích của hệ thống: nhân vật chính làm chủ, thương lượng lại luật, hoặc thoát khỏi nó mà giữ được thành quả bằng sức thật.'
  outline_brief: '- Mỗi cảnh có một mục tiêu đo được: nhận hay từ chối nhiệm vụ, tiến độ tới đâu, thưởng phạt gì treo trên đầu; số liệu thay đổi phải ít, rõ và có hậu quả ngay.

    - Xen nhiệm vụ hành động với đời thường để thấy kỹ năng mới dùng ra sao ngoài lúc nguy hiểm; việc lên cấp đổi cách người khác nhìn nhân vật chính.

    - Không để hệ thống giải quyết thay lựa chọn khó: nó chỉ đưa điều kiện, phần thưởng và thời hạn, nhân vật chính tự chọn và tự chịu.

    - Cao trào là nhiệm vụ cuối trái với điều nhân vật chính quý nhất, buộc họ phá cách làm nhiệm vụ thay vì chỉ làm đủ chỉ tiêu.'
  voice_brief: '- Sáng, nhanh, có cảm giác lên cấp: thông báo hệ thống ngắn, lạnh, đúng chữ; đời thật thì ấm và bừa bộn tương phản.

    - Câu văn gọn khi nhận nhiệm vụ, đếm tiến độ, mở thưởng; chậm lại khi hậu quả thật ập đến để thấy đây không chỉ là trò chơi.

    - Lời thoại của hệ thống vô cảm, hay đúng lúc một cách đáng ngờ; nhân vật chính cằn nhằn, mặc cả, tìm kẽ hở như người chơi lâu năm.

    - Hài từ chênh lệch giữa tên kỹ năng oai hùng và việc đời thường nó được dùng vào; không biến mọi cảnh thành bảng số.'
- key: hoc_duong_thanh_xuan
  label: Học đường · thanh xuân
  hint: 'Bạn cùng bàn, kỳ thi và mối tình đầu chưa dám nói: những năm tháng không quay lại.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Học đường thanh xuân: trường lớp là thế giới chính với lớp học, đội tuyển, câu lạc bộ, căn tin, sân trường và áp lực thi cử, thầy cô, gia đình.

    - Xung đột chọn khác nhau mỗi truyện: tranh suất thi đấu hay học bổng, giữ tình bạn khi lệch hướng, đối mặt bắt nạt bằng chứng cứ và người lớn đáng tin, giấu một tài lẻ, giúp lớp vượt một biến cố chung.

    - Nhân vật chính đang định hình mình: một điểm mạnh chưa dám lộ, một nỗi sợ bị cười, một mục tiêu chưa dám nói với cha mẹ; bạn bè mỗi người một áp lực riêng, không ai chỉ làm nền.

    - Bí mật nhẹ mà đau: thư gửi nhầm, danh tính người giúp ẩn danh, lý do bạn thân xa dần, sự thật sau một lần điểm kém hay mất đồ; cú lật làm hiểu lại bạn bè, thầy cô hoặc chính mình.

    - Cái giá của trưởng thành là mất một tình bạn như cũ, trượt một cơ hội, bị hiểu lầm một thời gian hoặc phải thừa nhận sai trước lớp.

    - Kết năm học khép lại bằng một kỳ thi, buổi biểu diễn, trận đấu hay lễ tổng kết có kết quả cụ thể; mối quan hệ chính rõ ràng hơn, tiếc nuối được nói thành lời.'
  outline_brief: '- Mỗi cảnh gắn với một nhịp trường học cụ thể: tiết học, ra chơi, họp lớp, tập luyện, trực nhật; trong nhịp quen ấy phải có một điều đổi thay trong quan hệ hay mục tiêu.

    - Việc học và thi cử có hậu quả thật: điểm số, xếp hạng, suất chọn, lời phê; không dùng chúng chỉ làm phông.

    - Cảnh nhóm bạn đông người phải cho mỗi người một việc và một tiếng nói riêng; tin đồn lan phải có nguồn và sửa được bằng hành động, không tự tan.

    - Cao trào đặt vào sự kiện toàn trường hoặc kỳ thi lớn, nơi bí mật và lựa chọn của nhân vật chính không giấu được nữa.'
  voice_brief: '- Trong, sáng, hơi bâng khuâng; nắng sân trường, tiếng trống, phấn trắng, áo đồng phục chưa khô, xe đạp chờ nhau ngoài cổng.

    - Lời thoại tuổi học trò nhanh, trêu nhau, nói dối vụng, lúc giận lại im; mỗi bạn có biệt danh, câu cửa miệng và cách bênh bạn riêng.

    - Hài từ thầy cô, lớp trưởng, bạn ngồi cạnh và những kế hoạch nghiêm túc mà ngây ngô; không biến học sinh thành người lớn thu nhỏ.

    - Rung động đầu đời viết bằng lúng túng và tử tế: nhìn trộm, giữ chỗ, cho mượn vở, nói cảm ơn quá lâu.'
- key: dien_van_lam_giau
  label: Điền văn · làm giàu ở quê
  hint: 'Về quê dựng lại từ mảnh vườn, gian bếp: giàu lên chậm rãi bằng tay nghề và tình làng.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Điền văn làm giàu ở quê: nhân vật chính trở về hoặc bám trụ quê nhà, dựng sinh kế từ đất, vườn, ao, nghề thủ công, món ăn hay dịch vụ nhỏ; mỗi truyện chọn sản vật và vùng quê riêng.

    - Luật đời quê phải thật: mùa vụ có thời gian, cây con và vật nuôi không lớn qua đêm, tiền vốn quay vòng chậm, thời tiết và giá chợ đổi kế hoạch.

    - Xung đột chọn khác nhau mỗi truyện: giữ đất trước người muốn mua rẻ, cứu nghề sắp thất truyền, đưa sản phẩm ra chợ xa, thuyết phục nhà cùng làm, cạnh tranh với hộ làm ăn lớn hơn.

    - Người làng có tính và nhu cầu riêng: người già giữ nếp, thanh niên muốn đi xa, hàng xóm lắm lời mà tốt bụng, thương lái hay người thu mua mỗi bên một lý lẽ.

    - Bí mật nhẹ, lộ dần: vì sao mảnh đất bị chê, ai giữ bí quyết nghề cũ, món nợ cũ của gia đình, hay nguồn nước và giống cây từng khiến cả làng thất bại; cú lật làm một thứ tưởng bỏ đi thành vốn quý.

    - Cái giá là vốn ít phải chọn một việc mỗi mùa, mất mùa, mang nợ nhỏ, hoặc làm người nhà mất mặt khi thất bại trước làng.

    - Kết sinh kế đứng được qua một mùa vụ hay một phiên chợ lớn; giàu lên một nấc rõ ràng, quan hệ với làng và gia đình được hàn lại.'
  outline_brief: '- Mỗi cảnh làm một việc nhà nông hay buôn bán cụ thể tới nơi tới chốn: chuẩn bị gì, thiếu gì, ai giúp, hỏng ở đâu, bán hay giữ.

    - Nhịp theo mùa và theo tiền: gieo, chờ, chăm, thu, bán; hậu quả của thời tiết và quyết định vụ trước kéo sang vụ sau.

    - Xen việc làm ăn với bữa cơm nhà, việc làng, giỗ chạp, phiên chợ; quan hệ đổi qua việc cùng làm, không qua nói đạo lý.

    - Cao trào là một vụ mùa, phiên chợ hay đơn hàng lớn quyết định sinh kế, nơi mọi chuẩn bị trước đó được dùng hết.'
  voice_brief: '- Ấm, chậm, thơm mùi bếp và đất sau mưa; giàu cảm giác tay chân: nhổ cỏ, nhóm lửa, cân hàng, đếm tiền lẻ, phơi nắng.

    - Câu văn thong thả khi làm việc, rôm rả khi ra chợ hay ăn cơm đông người; căng thẳng nằm ở trời sắp mưa và giá đang xuống.

    - Lời thoại quê mộc mạc, mỗi người một giọng: người già nói kinh nghiệm, người trẻ tính nhanh, thương lái nói ngọt mà ép giá.

    - Hài ấm từ vật nuôi, hàng xóm, chuyện làng và những lần tính toán khôn ngoan hóa vụng; món ăn và sản vật được tả bằng mùi, vị, độ giòn, màu sắc.'
- key: xuyen_khong
  label: Xuyên không · lạc sang đời khác
  hint: Lạc vào thân phận và thời thế xa lạ, phải sống sót bằng trí nhớ cũ và học lại luật mới.
  styles:
  - prose
  - audio
  naming:
    names: han_viet
    places: hu_cau
  setup_brief: '- Nhân vật chính rơi sang một đời khác hẳn đời mình từng sống: thời thế lạ, thân phận mượn, quan hệ sẵn có mà mình không hề tạo ra.

    - Mỗi truyện chọn một điểm rơi và một lệch luật làm gốc rắc rối: lệ tục trái thói quen, thân phận mang nợ cũ, hoặc một khả năng đời trước bỗng thành điều cấm kỵ.

    - Lợi thế là kiến thức và kỹ năng từ đời trước, nhưng luôn thiếu tiền, thiếu người tin, thiếu điều kiện để làm lại y nguyên.

    - Xung đột đến từ va chạm cách nghĩ hai đời, người quen của thân cũ, và những món nợ thân phận để lại.

    - Bí mật xoay quanh lý do lạc sang đây, thân cũ đã đi đâu, ai đã nhận ra sự khác thường; cú lật có thể biến lợi thế thành bằng chứng tố cáo nhân vật chính.

    - Cái giá phải trả là chọn giữa đường về và những người đã gắn bó ở đời mới, hoặc từ bỏ danh tính cũ để giữ mạng sống hiện tại.

    - Kết gỡ hết mối về thân phận và đường về: ở lại dựng đời mới, trở về mang theo mất mát, hoặc mở được lối đi giữa hai bên với điều kiện rõ ràng.'
  outline_brief: '- Mỗi cảnh đặt nhân vật chính trước một chi tiết lệch luật: thử dùng hiểu biết cũ, bị chặn lại, rồi học được giá của lệ mới.

    - Xen cảnh sinh tồn thường ngày với cảnh thân phận mượn bị thử thách, để bí mật lộ qua sinh hoạt chứ không chỉ qua lời kể.

    - Mỗi chương khép lại bằng một thích nghi nhỏ thành công và mở thêm một rạn nứt về đường về hoặc thân phận cũ.'
  voice_brief: '- Giọng ngỡ ngàng mà tỉnh táo, có nét tự trào khi đối chiếu hai đời, không coi người ở thế giới mới là ngây ngô.

    - Câu văn ngắn, nhanh lúc ứng biến hoặc bị lộ tẩy; giãn ra khi quan sát phong tục, cảnh vật và cách người ta sống.

    - Lời thoại tách rõ hai lớp: người bản địa nói theo lệ và bậc, nhân vật chính hay lỡ lời theo thói cũ rồi phải chữa.

    - Hài sinh ra từ hiểu lầm ngôn ngữ, lệ tục và ứng dụng sai kiến thức, gỡ bằng hành động chứ không bằng chê bai.'
- key: cung_dau
  label: Cung đấu · hậu cung
  hint: Giữa lễ nghi và vị phân, một câu nói, một món quà cũng có thể đổi mạng người.
  styles:
  - prose
  - audio
  naming:
    names: han_viet
    places: hu_cau
  setup_brief: '- Thế giới khép trong cung cấm, nơi vị phân, ân sủng, con nối và gia tộc sau lưng là bốn thứ tiền tệ; luật bất thành văn nhiều khi nặng hơn chiếu chỉ.

    - Mỗi truyện chọn một bàn cờ chính: tranh vị phân, giữ chỗ đứng cho con, liên minh đổi chủ, hoặc họa từ tiền triều dội vào hậu cung.

    - Nhân vật chính không mạnh nhất lúc mở màn; phải biết mượn tay, nhường một bước và nhớ ơn oán của từng người hầu, từng vị phi tần.

    - Bí mật thường nằm trong một món đồ ngự ban, một lá thư qua tay nhiều người, thân thế một đứa trẻ hoặc một lần lâm bệnh không rõ cớ.

    - Cú lật nên đảo nghĩa của ân huệ: món quà là cái bẫy, lần được sủng ái là mồi nhử, đồng minh kín nhất lại giữ đường lui riêng.

    - Cái giá phải trả là tình cảm thật, tự do ít ỏi, uy tín trước người dưới, hoặc một người trung thành phải chịu thay.

    - Kết gỡ hết ân oán đã mở: lên bậc nhưng mất thứ từng muốn giữ, rút lui an toàn, hoặc phá được một lệ cũ để người sau bớt khổ.'
  outline_brief: '- Mỗi cảnh là một nước cờ gói trong lễ nghi: thỉnh an, yến tiệc, ban thưởng, thăm bệnh; thắng thua lộ qua ai được ngồi, ai bị bỏ quên, ai phải nhận món đồ khó từ chối.

    - Nước cờ chỉ tính khi có người chứng kiến hoặc vật chứng đổi tay rõ ràng; tin đồn phải được gieo, lan và quay lại cắn một bên.

    - Mỗi chương khép bằng một đổi bậc nhỏ về sủng ái, vị phân hoặc lòng tin, đồng thời một đồng minh bắt đầu lung lay.'
  voice_brief: '- Giọng nhã, lạnh và nhiều lớp; bề mặt là lời chúc mừng, bên dưới là dao găm, nghe kỹ mới thấy ai đang thua.

    - Nhịp chậm mà căng, dồn vào ánh mắt, cách xưng gọi đổi bậc, bàn tay đặt lên món đồ lâu hơn thường lệ.

    - Lời thoại đúng lễ nhưng mỗi câu có gai; đổi cách xưng một chữ cũng là đổi thế đứng.

    - Không hài ồn; chỉ có châm biếm rất khẽ từ người hầu già hoặc câu đáp quá lễ phép khiến đối phương cứng họng.'
- key: hai_huoc_doi_thuong
  label: Hài hước · đời thường
  hint: 'Xóm giềng, nhà trọ, chuyện mưu sinh vụn vặt: càng nghiêm túc tính toán càng sai bét.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: that
  setup_brief: '- Thế giới gần gũi: khu nhà, chỗ làm, quán xá, họ hàng và hàng xóm, nơi tiền lẻ, sĩ diện, thói quen và tin đồn là luật chạy ngầm.

    - Mỗi truyện chọn một kế hoạch tưởng đơn giản: kiếm thêm thu nhập, sửa sang nhà cửa, ra mắt họ hàng, tổ chức một bữa tiệc, giữ một mối quan hệ yên ổn.

    - Nhân vật chính có một tật hài rõ rệt như hay tính quá, sợ mất mặt, nói trước quên sau; người xung quanh mỗi người một logic riêng, ai cũng tưởng mình đúng.

    - Bí mật thuộc loại nhẹ mà khó nói: món tiền mượn chưa trả, món đồ làm hỏng chưa dám nhận, người giúp thầm sau lưng.

    - Cú lật làm hiểu lầm đảo chiều: kẻ tưởng phá đám lại đang cứu nguy, thứ tưởng vô dụng lại thành cứu cánh.

    - Cái giá thường là mất sĩ diện trước mọi người, tốn tiền đền, hoặc phải bỏ một thói quen đã giữ rất lâu.

    - Kết gỡ hết hiểu lầm bằng hành động: việc thành theo cách không ngờ, hoặc việc hỏng nhưng mở ra một mối quan hệ, một nghề mới đáng giá hơn.'
  outline_brief: '- Mỗi cảnh dựng một kỳ vọng thật nghiêm túc, rồi để một chi tiết đời thường nhỏ làm chệch hẳn, kéo theo hậu quả dây chuyền.

    - Hiểu lầm phải leo dần qua lời kể lại, tin nhắn gửi nhầm, khách đến sai lúc; gỡ được một nút thì nút cũ quay lại ở dạng mới.

    - Mỗi chương gỡ một phần bằng việc làm cụ thể như đền, sửa, xin lỗi, chứ không chỉ đứng giải thích cho hết chuyện.'
  voice_brief: '- Giọng tươi, nhanh và duyên; buồn cười từ tình huống và thói tật, không lấy ngoại hình hay nỗi đau của ai làm trò.

    - Câu ngắn, lời thoại ngắt nhịp như nói thật ngoài đời, một câu đáp tưởng hiền mà làm cả cảnh đứng hình.

    - Mỗi người có một kiểu nói riêng: nói vòng, nói cụt, hay triết lý vặt, hay chen tiếng hàng quán.

    - Chuyện kể được tự trào ngắn gọn, điểm đúng lúc rồi đi tiếp, không giảng giải vì sao đáng cười.'
- key: the_thao_thi_dau
  label: Thể thao · thi đấu
  hint: Tập luyện, chấn thương, đối thủ xứng tầm và trận đấu mà thắng thua đổi cả mùa giải.
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: that
  setup_brief: '- Mỗi truyện chọn một môn, một luật chơi và một đích thi đấu rõ ràng, từ suất vào đội đến trận tranh hạng; đổi môn và xuất phát cho từng truyện.

    - Nhân vật chính có điểm mạnh thật và một trần kỹ thuật phải phá, không phải tài năng chạm đâu cũng thắng.

    - Xung đột đến từ giành suất, mâu thuẫn trong đội, bài chiến thuật bị bắt, áp lực tiền bạc và gia đình, hoặc cơ thể không chịu nghe lời.

    - Đối thủ có lối chơi và niềm kiêu hãnh riêng, thắng được phải nhờ đọc đúng người, không nhờ đối thủ bỗng dở đi.

    - Bí mật có thể là một chấn thương đang giấu, một bài tủ bị lộ, lý do một đồng đội sa sút, hoặc suất chọn bị can thiệp từ trên.

    - Cái giá phải trả là thời gian, thể lực, một cơ hội học hành hay làm ăn, và đôi khi phải bỏ lối chơi sở trường để cứu cả đội.

    - Kết là trận quyết định gỡ hết mạch đã gieo: thắng bằng thứ từng thất bại, thua nhưng giành được suất và sự tôn trọng, hoặc đổi vai trò trong đội.'
  outline_brief: '- Xen cảnh tập có mục tiêu đo được, cảnh đời ngoài sân và trận đấu; mỗi buổi tập phải gieo một kỹ thuật hoặc điểm yếu dùng lại về sau.

    - Trận đấu chia nhịp rõ: bị dẫn, đổi chiến thuật, trả giá bằng thể lực, rồi một khoảnh khắc quyết định đến từ thứ đã tập.

    - Mỗi chương đổi cục diện một bước: thứ hạng, lòng tin của đội, hoặc cách nhìn của đối thủ, không thắng liên tiếp chỉ nhờ may rủi.'
  voice_brief: '- Giọng gọn và dồn dập khi thi đấu, chậm lại trong phòng tập với tiếng giày, tiếng thở và những lần làm lại một động tác.

    - Thuật ngữ chuyên môn giải thích bằng hành động và hậu quả ngay trên sân, không dừng lại thuyết giảng.

    - Lời thoại trên sân ngắn, hô gọi và ra hiệu; ngoài sân mới có trêu chọc, giận dỗi và những câu động viên vụng về.

    - Tôn trọng đối thủ và mồ hôi của mọi người; hài chỉ xen nhẹ từ đời sống đội, không phá căng thẳng của trận đấu.'
- key: am_thuc
  label: Ẩm thực · vị nhớ
  hint: Một món ăn mở ra bí mật gia đình, một gian bếp nhỏ tranh nhau bằng tay nghề thật.
  styles:
  - prose
  naming:
    names: viet
    places: that
  setup_brief: '- Thế giới xoay quanh gian bếp, quán ăn, khu chợ và mâm cơm, nơi nguyên liệu theo mùa, khẩu vị từng nhà và tiếng lành truyền miệng là luật.

    - Mỗi truyện chọn một mạch chính: giữ một quán đang xuống, tìm lại món thất truyền, mở bếp mới, hoặc tranh hơn thua bằng tay nghề trong một dịp lễ, một cuộc thi nấu.

    - Nhân vật chính nhạy vị nhưng thiếu một thứ: vốn, người phụ, một kỹ năng căn bản, hoặc can đảm bỏ cách nấu tắt cho nhanh.

    - Người dạy nghề, khách sành ăn và đối thủ đều có lý do giữ kín bí quyết của mình; đối thủ phải giỏi thật để món thắng có giá.

    - Bí mật nằm trong công thức thiếu một bước, một thứ gia vị tưởng thay thế được, hoặc món ăn gắn với người đã rời đi chưa nói hết lời.

    - Cú lật thường ở vị giác: thứ tưởng là lỗi lại là chủ ý của người xưa, hoặc vị chuẩn trong trí nhớ đã đổi vì người nấu năm ấy thiếu thốn.

    - Cái giá là tiền vốn, công sức học lại từ đầu, và dám bỏ món tủ không còn hợp thời để cứu cả quán.

    - Kết là một bữa ăn quyết định gỡ hết mạch: quán đứng được bằng món mới, công thức trao đúng người, hoặc mâm cơm hóa giải chuyện cũ.'
  outline_brief: '- Mỗi cảnh làm một việc bếp cụ thể: đi chợ chọn đồ, sơ chế, canh lửa, nếm và chỉnh vị; quyết định trong bếp phải làm quan hệ ngoài bếp đổi theo.

    - Xen giờ bếp nóng với lúc đi tìm nguyên liệu hoặc học một mẹo nghề, để mỗi món ăn mang theo một lớp chuyện cũ.

    - Mỗi chương khép bằng một món thành hoặc hỏng có hậu quả thật, và gieo một nguyên liệu, một vị còn thiếu cho chặng sau.'
  voice_brief: '- Giọng giàu cảm giác nhưng tiết chế: tiếng dao thớt, hơi nóng phả lên mặt, vị chua đến sau vị ngọt, bàn tay chai vì cầm chảo.

    - Nhịp nhanh và gọn khi bếp vào giờ đông khách, chậm lại ở khoảnh khắc nếm đầu tiên gợi nhớ một người, một mùa.

    - Lời thoại trong bếp ngắn, ra lệnh và đáp gọn; khách hàng nói tính cách qua cách gọi món, thêm bớt một thứ gia vị.

    - Hài nhẹ từ khách khó chiều, bếp chật người đông và những lần nêm nếm suýt quá tay, không lấn át tình cảm gắn với món ăn.'
- key: phieu_luu_kham_pha
  label: Phiêu lưu · khám phá
  hint: 'Bản đồ thiếu, đất lạ và đồng đội bất đắc dĩ: mỗi chặng đi mở một bí mật lớn hơn.'
  styles:
  - prose
  - audio
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Thế giới là vùng ít dấu chân người: rừng sâu, đảo xa, hang động, sa mạc hoặc tàn tích hư cấu, nơi thiên nhiên đặt luật và người đi phải tuân theo.

    - Mỗi truyện chọn một mục tiêu hành trình: tìm người mất tích, lần theo vật bị mất, mở một tuyến đường, hoặc đưa cả đoàn trở về an toàn.

    - Nhân vật chính giỏi một kỹ năng đọc dấu hoặc sinh tồn nhưng yếu hẳn một mặt khác, buộc phải dựa vào đồng đội có nghề bổ sung.

    - Đồng đội mỗi người có mục đích riêng khi nhận chuyến đi; người dẫn đường địa phương biết một điều quan trọng mà chưa chịu nói.

    - Bí mật nằm ở bản đồ bị sửa, lối cấm có lý do thật, hoặc vật cần tìm không hề giống lời đồn đã kéo đoàn lên đường.

    - Cú lật nên đổi nghĩa của đích đến: dấu tích tưởng dẫn tới kho báu lại là lời cảnh báo, nơi tưởng đường cùng lại là lối ra duy nhất.

    - Cái giá là lương thực, thời gian trước mùa mưa bão, thiết bị không thay được, và lúc nguy cấp phải bỏ mục tiêu ban đầu để cứu người.

    - Kết gỡ hết dấu hiệu đã gieo: tới đích rồi trở về, đổi đích vì sự thật vừa lộ, hoặc chôn lại thứ không nên mang về.'
  outline_brief: '- Mỗi cảnh là một chặng có trở ngại cụ thể về địa hình, thời tiết hoặc dấu đường mất hút, đồng thời tìm thấy một dấu hiệu mới.

    - Nguồn lực phải hao đi trông thấy: nước, lương thực, pin, sức người; dùng hết một thứ thì chặng sau khó hẳn lên.

    - Mỗi chương đi được một đoạn đo được trên hành trình, lộ thêm một lớp bí mật, và khép bằng dấu hiệu buộc cả đoàn đổi kế hoạch.'
  voice_brief: '- Giọng rộng và sáng, căng lên khi thiên nhiên ép người vào chân tường, lắng xuống bên bếp lửa sau một ngày đi.

    - Mô tả bằng dấu vết cụ thể: vết chân đứt quãng, mùi đất sau mưa, tiếng nước từ xa, đá đổi màu; ít tính từ hoa mỹ.

    - Lời thoại thực dụng, chia việc và nhắc nhau giữ sức; khi mệt, người ta tranh cãi bằng những câu rất ngắn.

    - Hài đồng đội khô và ấm, đến từ thói quen trái ngược nhau trên đường, không làm nhẹ đi hiểm nguy thật.'
- key: quan_su_chien_tranh
  label: Quân sự · chiến tranh hư cấu
  hint: Mặt trận hư cấu, mệnh lệnh và đồng đội phải đưa nhau qua từng chặng của một chiến dịch.
  styles:
  - prose
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Bối cảnh là một cuộc chiến hoàn toàn hư cấu, nơi địa hình, thời tiết, đường tiếp tế và thông tin sai lệch quyết định thắng thua nhiều hơn lời khích lệ.

    - Mỗi truyện chọn một nhiệm vụ ở tầm nhỏ mà nhân vật chính nhìn thấy tận mắt: giữ một vị trí, rút lui cùng thương binh, trinh sát một tuyến đường, hoặc bảo vệ đoàn người di tản.

    - Nhân vật chính không nắm toàn cục; chỉ huy có lý do riêng khi giấu bớt thông tin, đồng đội mỗi người một kỹ năng và một nỗi sợ không nói ra.

    - Phía bên kia cũng có kỷ luật, có người chờ ở nhà, để thắng thua không thành chuyện một chiều.

    - Bí mật thường ở mệnh lệnh dựa trên tin sai, tuyến tiếp tế bị cắt mà chưa ai hay, hoặc mục tiêu thật của đợt tiến công khác hẳn lời phổ biến.

    - Cú lật đổi nghĩa của thắng lợi: nơi tưởng an toàn lại là hướng đánh chính, thứ vừa giữ được hóa ra là mồi nhử.

    - Cái giá là vị trí, khí tài, thời gian cứu người, niềm tin vào cấp trên, những thứ không lấy lại được sau chiến dịch.

    - Kết khép chiến dịch bằng một giữ, mất hoặc rút lui có hậu quả rõ, bí mật của mệnh lệnh lộ hết, người còn sống mang theo phần việc dở dang của nhau.'
  outline_brief: '- Xen cảnh chuẩn bị với cảnh hành động và hậu quả sau đó: xem bản đồ, chia phần tiếp tế, chờ trong im lặng, rồi một mệnh lệnh làm đổi hết.

    - Mỗi cảnh quân sự phải rõ mục tiêu, giới hạn thời gian và nguồn lực, và cho thấy thế trận đã khác gì khi cảnh khép lại.

    - Mỗi chương dịch chuyển chiến dịch một bước và đặt nhân vật chính giữa nhiệm vụ được giao với con người ngay bên cạnh.'
  voice_brief: '- Giọng khô, chặt và ít tính từ; căng thẳng đến từ chờ đợi, mệnh lệnh ngắn và khoảng lặng sau tiếng động lớn.

    - Cảnh hành động viết bằng hành động nối tiếp, rõ ai ở đâu, đang giữ gì, không rối trong thuật ngữ.

    - Lời thoại theo cấp bậc lúc làm nhiệm vụ, trượt về cách nói đời thường khi đồng đội mệt, đói và nhớ nhà.

    - Không tô chiến tranh bằng khẩu hiệu; sự ấm áp nằm ở chia nhau phần ăn, giữ lời hứa và cõng nhau đi nốt đoạn đường.'
- key: tam_ly_toi_pham
  label: Tâm lý tội phạm
  hint: Đọc hành vi, lần vào suy nghĩ của kẻ gây án qua thẩm vấn và đàm phán trước lần gây án tiếp theo.
  styles:
  - prose
  naming:
    names: viet
    places: hu_cau
  setup_brief: '- Thế giới gồm hồ sơ hành vi, hiện trường, phòng thẩm vấn và những người bị tổn thương còn ở lại; suy đoán tâm lý luôn phải được chứng cứ vật chất kiểm chứng, không đọc vị bằng trực giác thần kỳ.

    - Mỗi truyện chọn một mạch: lần theo kẻ gây án lặp lại, đàm phán khi có người bị giữ, thẩm vấn nghi phạm chỉ nói dối một phần, hoặc lật lại vụ đã khép vì hồ sơ tính cách không khớp.

    - Nhân vật chính giỏi nhận ra mẫu hành vi lặp lại nhưng có một điểm mù từ trải nghiệm riêng, đồng đội thực địa và chuyên môn khác giữ chân suy đoán không bay xa.

    - Đối tượng có nhu cầu riêng chi phối hành vi: được công nhận, kiểm soát người khác, che một mối liên hệ, hoặc trốn một tội khác lớn hơn.

    - Bí mật nằm ở động cơ giả che động cơ thật, câu nói lặp lại vô tình, khoảng trống thời gian, hoặc mối liên hệ bị giấu với nạn nhân.

    - Cú lật có thể là hồ sơ đúng người nhưng sai thời điểm, kẻ tưởng đứng ngoài mới là trung tâm, hoặc lời thú nhận là màn che cho người khác.

    - Cái giá là thời gian khi đối tượng còn tự do, lòng tin của cả đội, và ranh giới nghề nghiệp khi nhân vật chính phải đồng cảm vừa đủ để đối thoại.

    - Kết là cuộc đối đầu bằng chứng cứ và hiểu đúng nhu cầu của đối tượng, gỡ hết mẫu hành vi đã gieo từ đầu.'
  outline_brief: '- Luân phiên hiện trường và hồ sơ, phỏng vấn người liên quan, thẩm vấn hoặc đàm phán, rồi hành động ngăn chặn dựa trên điều vừa suy ra.

    - Mỗi cảnh phải loại bỏ một giả thuyết bằng chi tiết cụ thể, hoặc thu hẹp hồ sơ thành một quyết định truy tìm hay bảo vệ rõ ràng.

    - Mỗi chương lộ một mẫu hành vi mới và đặt lại câu hỏi về động cơ; cao trào là cuộc đối thoại mà chứng cứ khóa dần đường lui của đối tượng.'
  voice_brief: '- Giọng lạnh, chính xác và căng ngầm; phân tích viết ngắn gọn, thuật ngữ được giải thích qua chi tiết hành vi thay vì chồng chất khái niệm.

    - Nhịp chậm trong phòng thẩm vấn với nhiều khoảng lặng, nhanh lên khi một chi tiết hồ sơ vừa khớp với hiện trường.

    - Lời thoại thẩm vấn dùng câu hỏi tưởng nhẹ mà khóa đường lui; đối tượng có giọng riêng, tự ái riêng và cách tự kể về mình rất riêng.

    - Không tôn vinh kẻ gây án và không đùa trên người bị hại; sự lạnh nằm ở cách nhìn thẳng vào hành vi, không ở miêu tả rùng rợn.'
