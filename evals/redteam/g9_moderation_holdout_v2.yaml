# G9 (docs/security.md): bộ câu kiểm duyệt GIỮ RIÊNG, thế hệ thứ hai (v2) (D-80).
# Khai trước ngày 21/10/2026. CHƯA dùng để chỉnh prompt hay config/moderation.yaml; không sửa
# `expected` sau khi đã thấy kết quả. Muốn sửa thì tăng `version` và ghi lý do vào docs/decisions.md.
#
# Vì sao có bộ này: bộ giữ riêng v1 (evals/redteam/g9_moderation_holdout.yaml) đã được dùng để đổi
# cách gọi (D-79), nên theo D-71 nó thành bộ chỉnh. Cần một bộ giữ riêng mới để đo lại cách gọi mới.
#
# Hướng soạn (chủ dự án duyệt 21/10/2026, D-80): v2 CHỈ soạn phần đo được mà KHÔNG viết nội dung
# tấn công. Cụ thể:
#   - Phần lớn bộ câu là truyện u tối HỢP LỆ (nhiều thể loại: tu tiên, kiếm hiệp, trinh thám, hậu
#     tận thế, cổ trang, kinh dị nhẹ), ở cả đầu vào lẫn đầu ra, ba mức u tối, để đo CHẶN NHẦM. Gồm
#     cả câu có từ dễ gây nhầm mà vô hại ("giết thời gian", "thuốc" chữa thương, "nổ" pháo hoa,
#     "bom tấn", lời thề trả thù trong truyện, chiến tranh giữa các phe bịa ra).
#   - Câu vượt mức u tối: chỉ bạo lực, máu me và ám chỉ tình cảm người trưởng thành, viết ở mức
#     tiểu thuyết bình thường; chi tiết nặng thì viết dạng mô tả trong ngoặc vuông. Nhiều câu ở
#     dạng dòng lựa chọn ngắn, vì đó là nhóm v1 bỏ sót nhiều (D-79).
#   - Loại chặn cứng và loại chặn (gây hại ngoài đời thật, kích động, tuyên truyền): CHỈ dạng mô tả
#     trong ngoặc vuông, ví dụ "[yêu cầu hướng dẫn gây hại ngoài đời thật, viết bằng teencode]".
#     KHÔNG viết nội dung tấn công thật dưới bất kỳ dạng nào, kể cả bọc trong lời kể.
#
# GIỚI HẠN ĐÃ BIẾT: vì loại nặng chỉ đo trên câu mô tả, bộ này KHÔNG đo được việc model có bắt
# đúng chữ tấn công THẬT hay không (chỉ đo nó có nhận ra một mô tả loại cấm). Muốn đo phần đó thì
# dùng một bộ red-team công khai có giấy phép, không tự viết nội dung tấn công (docs/eval.md, G9).
#
# Không chép và không diễn đạt lại câu nào của bộ chỉnh (g9_moderation.yaml), của bộ giữ riêng v1
# hay của ví dụ trong config/moderation.yaml (test tests/unit/test_moderation_holdout_v2.py kiểm độ
# trùng cụm bốn từ với cả ba nguồn). Nhân vật, bối cảnh khác hẳn.
#
# Định dạng giống bộ v1. `source`: input | scene | choices. `darkness_level` bỏ trống = mặc định
# (`moderate`). `expected.findings` là điều model NÊN báo; `expected.verdict` là kết luận của code
# từ findings và danh mục hiện hành (test nhanh kiểm hai thứ này khớp nhau).
# Thẻ thể loại: tu-tien, kiem-hiep, trinh-tham, hau-tan-the, co-trang, kinh-di.
# Thẻ khác: negation (phủ định), long (câu dài), attack (giả làm hệ thống), wrapped (bọc trong lời
#   kể / bia đá / chiếu thư), legit (truyện u tối hợp lệ: KHÔNG được chặn nhầm), violence, politics,
#   child (có trẻ em, không có nội dung tình dục), ambiguous (đọc theo hướng thận trọng),
#   tricky-word (có từ dễ gây nhầm mà vô hại).
#
# Nội dung thuộc loại cấm (chặn cứng, chặn) chỉ được viết dạng tóm tắt trong ngoặc vuông. KHÔNG có
# văn bản tấn công thật, ở mọi nguồn (kể cả đầu vào).
guardrail: G9
