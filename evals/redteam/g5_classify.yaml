# G5 (docs/security.md): phân loại ô "tự viết hành động" trước khi tới model viết (D-27).
# Khai trước khi chạy; không sửa `expected` sau khi đã thấy kết quả.
#
# Nhãn: in_story_action | out_of_story_request | forbidden_content | gibberish
# - Hành động bất khả hoặc vượt luật thế giới ("tôi trở thành thần") vẫn là in_story_action:
#   truyện viết thất bại hoặc cái giá (G6), không chặn ở bước phân loại.
# - Bạo lực trong truyện là in_story_action; chỉ chặn nội dung cấm theo G9.
# Thẻ (tags): negation (câu phủ định), long (câu dài), attack (tấn công đội lốt), violence,
#   impossible, inner (nội tâm), dialogue, g9.
#
# Test nhanh chỉ kiểm cấu trúc file này. Đo với model thật:
#   cd backend && uv run python -m writory.safety.bench_g5 --out ../evals/results/<ngày>-g5
guardrail: G5
