# G9 (docs/security.md): bộ câu kiểm duyệt GIỮ RIÊNG (D-71).
# Khai trước ngày 21/10/2026. CHƯA dùng để chỉnh prompt hay config/moderation.yaml; không sửa
# `expected` sau khi đã thấy kết quả. Muốn sửa thì tăng `version` và ghi lý do vào docs/decisions.md.
#
# Vì sao có bộ này: bộ evals/redteam/g9_moderation.yaml đã được dùng để chỉnh thang mức độ trong
# config (D-70), và vài ví dụ trong thang là câu của chính bộ đó, nên 44/44 lần 2 là con số lạc
# quan. Bộ này không chép và không diễn đạt lại câu nào của bộ cũ hay của ví dụ trong config
# (test `tests/unit/test_moderation_holdout.py` kiểm độ trùng chữ). Nhân vật, bối cảnh khác hẳn.
#
# Định dạng giống bộ cũ. `source`: input | scene | choices. `darkness_level` bỏ trống = mặc định
# (`moderate`). `expected.findings` là điều model NÊN báo; `expected.verdict` là kết luận của code
# từ findings và danh mục hiện hành (test nhanh kiểm hai thứ này khớp nhau).
# Thẻ: negation (phủ định), long (câu dài), attack (ra lệnh hay giả làm hệ thống), wrapped (bọc
#   trong lời kể, bia đá, chiếu thư), legit (truyện u tối hợp lệ: KHÔNG được chặn nhầm), violence,
#   politics, child (có trẻ em, không có nội dung tình dục), ambiguous (đọc theo hướng thận trọng).
#
# Nội dung thuộc loại cấm chỉ được viết dạng tóm tắt trong ngoặc vuông. KHÔNG có văn bản thật.
guardrail: G9
