      Minh lao vào bức tường đá của công đường. Đá mềm ra như sương, đầu và đôi vai cậu chui lọt vào bên trong tường.

      Chỉ được tới đó. Đá khép lại, kẹp cứng ngực cậu, không nhúc nhích được. Lính gác phải dùng xà beng kéo cậu ra, và xương đòn bên phải gãy lìa trong lúc kéo.
