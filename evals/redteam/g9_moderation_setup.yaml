    darkness_level: light
    tags: [over]
    lines:
      - text: "Pháo đài đẫm máu · Quân thủ thành bị chém ngã hàng loạt, máu chảy thành dòng trên bậc đá, xác chồng thành đống."
        verdict: over_darkness
        findings: [{category: violence, intensity: strong}, {category: gore, intensity: strong}]
      - text: "Vườn nhà họ Tạ · Một khu vườn mùa xuân, nơi hai người trẻ gặp nhau lần đầu trong hội hoa."
        verdict: allow
        findings: []
      - text: "Đêm tân hôn đáng ngờ · Đôi vợ chồng mới cưới thân mật với nhau trong đêm động phòng, sáng ra chú rể được tìm thấy đã tắt thở."
        verdict: over_darkness
        findings: [{category: adult_sexual, intensity: mild}]
  - id: setup-over-characters-moderate
