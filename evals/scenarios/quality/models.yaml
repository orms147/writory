# Bài đo D — danh sách model. Giá USD / 1 triệu token, lấy từ https://openrouter.ai/api/v1/models
# (chỉ để ước tính trước; chi phí thật lấy từ usage.cost).
# reasoning: model nào cho tắt thì tắt (effort "none"): bước viết trong app không cần suy luận, và
# suy luận tính như token ra (tốn tiền, tăng độ trễ). Model bắt buộc suy luận để mặc định thấp nhất.
#
# v3 (20/10/2026), cho lượt 2 (style guide v2, cases v2, rubric v2). Chủ dự án chọn:
#   giữ GPT-6 Luna, DeepSeek V4.1 Flash, GPT-6.1 Sol (mốc); Qwen 3.7 Plus → Qwen 3.8 Flash;
#   MiMo 2.6 Pro → MiniMax M3.1 Flash (bản miễn phí); bỏ Gemini 3.5 Flash-Lite vì giá cao.
# Lượt 1 dùng v2 (9 model rẻ + mốc): xem git history và evals/results/2026-10-19-quality-full/.
# Giá DeepSeek V4.1 Flash tăng từ 0.15/0.60 (19/10) lên 0.30/1.20 (20/10).
# MiniMax M3.1 Flash :free: giá 0, nhưng endpoint miễn phí có giới hạn tần suất và có thể dùng dữ liệu
# để huấn luyện; chỉ hợp cho bài đo, chưa chắc hợp cho người chơi thật.

version: 3

writers:
  - {id: openai/gpt-6-luna,                 label: GPT-6 Luna,          in: 0.10,  out: 0.50, reasoning: none}
  - {id: deepseek/deepseek-v4.1-flash-1017, label: DeepSeek V4.1 Flash, in: 0.30,  out: 1.20, reasoning: none}
  - {id: qwen/qwen3.8-flash,                label: Qwen 3.8 Flash,      in: 0.15,  out: 0.47, reasoning: none}
  - {id: minimax/minimax-m3.1-flash:free,   label: MiniMax M3.1 F free, in: 0.00,  out: 0.00, reasoning: none}
  # Mốc tham chiếu (không rẻ): khác họ với giám khảo, để biết "tốt" trông thế nào.
  - {id: openai/gpt-6.1-sol,                label: GPT-6.1 Sol (mốc),   in: 2.00,  out: 10.00, reasoning: mandatory-minimal}

judge:
  model: claude-sonnet-5-5
  effort: high
  thinking: adaptive
  # Không bật server-side fallbacks: giám khảo phải cố định; bài bị từ chối ghi riêng.
