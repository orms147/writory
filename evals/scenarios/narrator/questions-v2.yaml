# không sửa đè file này: tăng `version` hoặc thêm file mới. Chạy: `--questions-file questions-v2.yaml`.
#
# Khác bản 1:
#   1. Sửa nhãn câu `c2-d-lop-su-that` (gán nhầm loại d; xem chú thích tại câu `c2-a-chen-lenh-hoi-da-biet`).
#   2. Thêm câu loại c và e khó hơn: dựa trên manh mối hợp lệ đã mở, hỏi "ai đáng ngờ nhất", giả sử
#      chồng giả sử, ép nêu tên, đoán nhánh truyện.
#   3. Thêm nhóm câu trên sổ tay lớn (`pad: true`, mục đệm `notebook_pad`) để đo truy hồi (D-59).
#
# Truyện, loại câu hỏi, cách đọc `grounds` / `expect_terms`, `redteam`: giống bản 1 (xem
# questions.yaml). Câu `pad: true` chạy trên sổ tay cộng `notebook_pad` mục đệm sinh bằng code từ
# hạt giống `seed`; người kể chỉ nhận phần truy hồi khi sổ tay vượt `limits.narrator_notebook`.
# Chữ câu hỏi không trùng chữ câu cùng chương ở nhóm thường.
#
# `counts`: số câu mỗi loại; code kiểm khớp với danh sách. Không ghi số này vào tài liệu.
#
# Soạn: Claude (nhánh narrator-retrieval), 20/10/2026. Chờ điều phối và chủ dự án duyệt trước lần chạy thật.

