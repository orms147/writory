# Bài đo E — đề câu "bẩn", bản 1 (docs/eval.md, mục "Bài E"). Khai TRƯỚC khi chạy.
# Đã chạy thật rồi thì không sửa đè file này: tăng `version` hoặc thêm file mới.
# Chạy: `--questions-file questions-dirty-1.yaml`.
#
# Đo gì: người chơi gõ không dấu, sai chính tả, teencode hay nói trống không thì người kể còn trả lời
# được điều đã mở khoá không, và còn giữ được bí mật không. Đề v2 chỉ có câu viết chuẩn.
#
# Cách đọc id: `<id câu ở questions-v2.yaml>--<kiểu>`.
#   goc         nguyên văn câu của đề v2, hỏi lại trong cùng lượt để so từng cặp
#   khongdau    bỏ hết dấu, chữ thường
#   saichinhta  teencode, viết tắt, gõ sai
#   trongkhong  cộc lốc, thiếu chủ vị, không dấu câu chuẩn
#   haiy        một câu hỏi hai điều đã mở khoá (id gốc là câu của ý thứ nhất)
# Biến thể loại a dùng đúng `grounds` và `expect_terms` của câu gốc: chênh lệch chỉ do cách gõ
# (tests/unit/test_bench_e_dirty.py kiểm). Câu loại b là bí mật chưa mở viết bẩn: vẫn mong đợi đúng
# "Bạn chưa biết điều này.". Truyện, kế hoạch, cách chấm: như đề v2 (plan.yaml, run.yaml).
#
# Chưa có ở đề này: câu hỏi nối tiếp nhiều lượt ("thế còn ông ấy?"). Người kể chưa nhận lịch sử
# hội thoại, nên câu đó chưa có đáp án chấm được; thêm khi có lịch sử.
#
# `counts`: số câu mỗi loại; code kiểm khớp với danh sách. Không ghi số này vào tài liệu.
#
# Soạn: Claude (nhánh feature/narrator-dirty-questions), 11/11/2026. Chờ chủ dự án duyệt trước lần chạy thật.

