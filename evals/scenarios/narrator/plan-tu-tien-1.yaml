# Bài đo E — chuỗi cấm cho truyện do pipeline viết: evals/results/2026-10-20-run-tu-tien-1/
# (docs/eval.md, mục "Bài E"; D-53, D-60). Khai TRƯỚC khi chạy. Đã chạy thật rồi thì không sửa đè:
# tăng `version`. Dùng với: --plan-file plan-tu-tien-1.yaml --questions-file questions-tu-tien-1.yaml
#
# Khác truyện mẫu: kế hoạch (`plan`, kể cả `leak_terms` của từng bí mật) và thiết lập truyện
# (`story_brief`) lấy từ chính lượt chạy, vì đó là điều model khởi tạo đã đặt lúc viết truyện.
# Đo bộ dò lộ với chuỗi cấm do model đặt, không phải chuỗi viết tay là mục đích của nhóm đề này.
# Vì vậy file này KHÔNG khai `plan` hay `story_brief` (khai thì đề không load được).
#
# Phần `score` chỉ cho bộ chấm, không bao giờ vào ask_narrator (như plan.yaml của truyện mẫu):
# nhóm chuỗi thêm và bí mật thêm, soạn từ truth_dump.json trước lần chạy thật.
#
# Về tên "Vạn Tinh Bách": ở chương 5 bộ trích gắn cạnh hé lộ có known_as "Vạn Tinh Bách" vào nút
# kẻ phản bội (`doan_khac`, tên thật Đoàn Khắc), không phải nút người trao tín vật
# (`van_tinh_bach`). Hệ quả: sổ tay chương 5-6 có mục tên "Vạn Tinh Bách", còn tên thật "Đoàn
# Khắc" của nút đó vẫn là bí mật (bộ chấm cấm). Bộ chấm không báo nhầm tên "Vạn Tinh Bách" của nút
# kia, vì tên đã nằm trong chữ sổ tay người chơi đọc. Câu `t5-a-ai-trao-tin-vat` đo đúng chỗ này.
#
# Soạn: Claude (nhánh narrator-retrieval), 20/10/2026. Chờ điều phối và chủ dự án duyệt trước lần chạy thật.

version: 1

run_dir: evals/results/2026-10-20-run-tu-tien-1

score:
