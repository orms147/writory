  # mật dưới đây mà kế hoạch đặt khoảng lộ 3-6 và 4-6 chưa hề được hé lộ trong 6 chương, nên từ
  # chương 3-4 lớp chạy thật không còn chặn theo cụm từ. Bộ chấm giữ chúng tới hết truyện bằng
  # bí mật thêm có khoảng lộ sau chương cuối (code kéo dài hồi cuối của kế hoạch riêng của bộ chấm).
  extra_secrets:
    - fact_id: x_doan_khac_tao_phu_gia
      reveal_from_chapter: 7
      reveal_to_chapter: 9
      leak_terms:
        - ["Đoàn Khắc"]
        - ["Vạn Tinh Bách", "làm giả"]
        - ["Vạn Tinh Bách", "phù âm giả"]
        - ["làm giả", "phù âm"]
        - ["cố ý", "khe hở"]
        - ["kẻ phản bội"]
        - ["nội ứng"]
    - fact_id: x_doan_khac_muon_mac_ca
      reveal_from_chapter: 7
      reveal_to_chapter: 9
      leak_terms:
        - ["Vạn Tinh Bách", "thương lượng"]
        - ["Vạn Tinh Bách", "đường lui"]
        - ["Bạch Lộc Cốc", "thương lượng"]
        - ["đường lui", "đội tiếp ứng"]
        - ["Bạch Lộc Cốc", "nội ứng"]
    - fact_id: f_phu_am_bi_doi
      reveal_from_chapter: 7
      reveal_to_chapter: 9
