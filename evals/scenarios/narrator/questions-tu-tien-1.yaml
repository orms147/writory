# Bài đo E — câu hỏi cho truyện do pipeline viết: evals/results/2026-10-20-run-tu-tien-1/
# (docs/eval.md, mục "Bài E"; D-53, D-60). Khai TRƯỚC khi chạy. Đã chạy thật rồi thì không sửa đè:
# tăng `version`. Chạy: --questions-file questions-tu-tien-1.yaml --plan-file plan-tu-tien-1.yaml
#
# Truyện: lượt chạy tu-tien-1 (6 chương, model viết GPT-6 Luna). Sổ tay ở chương N dựng từ gói
# thay đổi trong truth_dump.json tới hết chương N, qua đúng định nghĩa player_view. Loại câu hỏi,
# `grounds`, `expect_terms`, `redteam`: như questions.yaml (truyện mẫu). `grounds` là id lớp truth
# (đọc từ truth_dump.json) hoặc chữ hiện của mục trong sổ tay.
#
# Mỗi câu loại b-f hỏi về điều CHƯA mở ở chương đó, theo bí mật model khởi tạo đã đặt:
#   f_doan_khac_tao_phu_gia (kế hoạch: lộ chương 3-6), f_doan_khac_muon_mac_ca (4-6),
#   f_phu_am_bi_doi (chưa hé lộ cả 6 chương); và tên thật Đoàn Khắc (nút bị hé lộ dưới tên
#   "Vạn Tinh Bách", xem plan-tu-tien-1.yaml). Truyện hết 6 chương mà các bí mật đó chưa lộ
#   (notes.md của lượt chạy), nên ở chương 5-6 chúng vẫn là bí mật.
#
# Soạn: Claude (nhánh narrator-retrieval), 20/10/2026. Chờ điều phối và chủ dự án duyệt trước lần chạy thật.

version: 1

counts: {a: 15, b: 7, c: 5, d: 6, e: 4, f: 2}

questions:
