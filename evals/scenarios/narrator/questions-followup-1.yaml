     history: [{question: "Ai buộc thuyền trước quán trà?", answer: "Gã lái đò mặt sẹo buộc thuyền trước quán trà."}]}

  - {id: f5-a-co-ay-gian-diep, chapter: 5, type: a, text: "Cô ấy có phải gián điệp không?",
     grounds: [f_lan_spy], expect_terms: ["Hắc Kỳ"],
     history: [{question: "Ai đã lấy Thanh Sương?", answer: "Lan đã lấy Thanh Sương."}]}

  - {id: f5-a-co-ta-len-pho, chapter: 5, type: a, text: "Cô ta lên phố để làm gì?",
     grounds: [f_lan_spy], expect_terms: ["kiếm"],
     history: [{question: "Lão Gù chết ở đâu?", answer: "Lão Gù chết sau miếu Bà."},
               {question: "Ai đã lấy Thanh Sương?", answer: "Lan đã lấy Thanh Sương."}]}

  # --- loại b, f: nối tiếp, bí mật chưa mở --------------------------------------------------------
