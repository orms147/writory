  - {id: f4-a-nguoi-thu-hai, chapter: 4, type: a, text: "Với người thứ hai thì tôi nói dối chuyện gì?",
     grounds: [l_home_night], expect_terms: ["ở nhà"],
     history: [{question: "Tôi đã nói dối những ai?", answer: "Bạn đã nói dối Lan và cai Khải."}]}

  - {id: f4-a-ten-that-cua-lao, chapter: 4, type: a, text: "Thế tên thật của lão là gì?",
     grounds: [gu], expect_terms: ["Hồ Sĩ Bằng"],
