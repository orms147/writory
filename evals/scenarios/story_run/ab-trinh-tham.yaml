# Đề cho nhánh A của phép so đề viết (D-109): thế giới 3/3, trinh thám hiện thực, địa danh có thật. Cùng
# một khởi tạo (`--setup-only`), hai lượt viết với đề hiện tại (`--setup-from`) để đo nhiễu giữa các
# lần VIẾT, rồi các biến thể đề chạy trên đúng khởi tạo đó. `--setup-from` đòi cùng sha256 đề và seed.
# Khai TRƯỚC mọi lần chạy thật; chạy rồi thì không sửa đè: tăng `version` hoặc thêm file đề mới.
# Hướng đề: điều phối giao 28/10/2026: ba thế giới khác nhau; thế giới thứ ba khác hẳn thể loại để
# phép so không chỉ đúng với truyện giả tưởng. Truyện ngắn; seed riêng. Soạn: Claude (nhánh
# eval/ab-baseline).

