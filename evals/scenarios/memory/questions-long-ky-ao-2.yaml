# trích như đề truyện vừa (D-83): true thì `derive` bắt buộc và code kiểm derive == gold; false thì đồ thị
# thiếu hoặc sai, có `derive` thì code kiểm derive != gold, không có thì không op nào tính được từ đồ thị.
# Đọc truth_dump.json trước khi soạn (khác truyện vừa, bộ trích ở đây ghi nhiều hơn hẳn):
#   - KNOWS của nhân vật chính về ba bí mật ghi đúng chương lộ trên trang (7, 11, 16); `told_by` có ở
#     luật Biển Muối (ch2) và bí mật Đoàn Khương (ch16), KHÔNG có ở bí mật Bến Cầu Gãy (ch11, how "chứng kiến").
#   - Bản đồ Nếp Gấp: HOLDS protagonist 0–2, ta_van 2–22, protagonist 22–24, protagonist từ 24 (ném sang
#     Tạ Vân rồi nhận lại ở ch24 chỉ còn là đóng rồi mở lại cạnh của nhân vật chính, như vụ cho mượn thẻ ở
#     truyện vừa). Thẻ Cân Nước: ta_van từ ch1. Chuỗi Khóa Gỗ: vo_ngan 0–14.
#   - KNOWS chỉ có ở nhân vật chính và người tự biết: Tạ Vân không có KNOWS nào về lời nói dối ch2, về
#     nét mực ch3, về bí mật Đinh Lộc giấu lối đi dù đã nghe làm chứng ở ch9; Lâm Kha không có KNOWS nào.
#   - LOCATED_AT của nhân vật chính trễ một chương ở ch8 (rung_suong tới ch9) và ghi bien_muoi ở ch19.
#   - Nhiều việc chỉ còn trong chữ của Fact mới (D-93): câu `text` với `node_text` đo được phần đó.
#
# Quy ước (cùng định dạng đề truyện vừa cho phần còn lại):
#   - Ưu tiên câu cần trí nhớ dài: phần lớn hỏi ở chương 20–24 về chuyện chương 1–16. Chi tiết được nhắc
#     lại về sau thì `fact_chapter` là chương nhắc lại gần nhất (<= ask_chapter), nên khoảng cách là thật.
#   - Nhân vật chính "Mai Thảo" kể ngôi thứ nhất; tên có trên trang từ ch1 ("Thảo") và ch3 ("Mai Thảo").
#     Đáp án là nhân vật chính thì nhận cả "nhân vật chính", "người kể", "tôi", "Thảo" (`aliases`).
#   - Câu hỏi "ở đâu" (nơi chốn của nhân vật) để ở nhóm `relation` (trạng thái hiện tại của nhân vật), vì
#     code chỉ có năm nhóm; chủ dự án quyết có tách nhóm hay không.
#   - Câu entities nêu sẵn trong câu hỏi những thực thể dễ bị nhắc kèm (Tạ Vân, Tuần Muối, tấm bản đồ...),
#     vì thực thể đã có trong câu hỏi không bị tính là thừa.
#   - KHÔNG hỏi điều chỉ có ở lớp sự thật (Đoàn Khương muốn độc quyền lối vượt, Phùng Yên từng sửa sổ theo
#     lệnh Khương, Võ Ngân sống sót sau chuyến vượt chặng) và chỗ trang tự mâu thuẫn hay mơ hồ: giới tính
#     và cách gọi của Tạ Vân (chị/bà/anh), Phùng Yên (cô/chị/anh), Đinh Lộc (anh/ông); ch10 Kha hỏi có định
#     giấu Tuần Muối chuyện Lộc giấu lối đi trong khi ch9 đã khai trước phiên chợ; ván trượt gãy ở ch15
#     nhưng ch16 còn dùng ván; số phận Võ Ngân sau ch15; nơi chốn ở ch19 và ch23–24 ("lối trở về Bến Cầu
#     Gãy" trong lúc đang ở bến); ai bị giữ ở đâu trong ch23–24.

