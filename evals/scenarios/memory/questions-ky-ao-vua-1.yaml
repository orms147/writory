# đáp án. Đáp án gốc lấy từ trang (`evidence`, code kiểm câu trích có thật). Mỗi câu khai thêm:
#   graph_agrees  true: đồ thị đã trích cho đúng đáp án của trang ở chương as_of/ask_chapter; `derive`
#                 bắt buộc và code kiểm derive == gold. false: đồ thị thiếu hoặc sai; có `derive` thì
#                 code kiểm derive != gold (ghi lại đồ thị nói gì), không có thì là đồ thị không có cạnh
#                 nào để tính. Báo điểm tách theo cờ này (summary.md), để thấy hệ đồ thị sai vì bộ trích
#                 hay vì đọc.
# Đọc truth_dump.json trước khi soạn: chương 2, 3 không có cạnh nào; cho mượn Thẻ Định Phong ở chương 4
# chỉ còn là đóng rồi mở lại cùng cạnh HOLDS của nhân vật chính; KNOWS của nhân vật chính về bí mật
# Trần Mặc bán tin ghi ở chương 9 (trang lộ ở chương 6), về giao ước gia tộc Phó ghi ở chương 10
# (trang lộ ở chương 8); quan hệ không đổi theo trang, chỉ đóng cạnh protagonist>tran_mac ở chương 9.
#
# Quy ước khác (cùng định dạng đề truyện mẫu cho phần còn lại: fact_chapter, as_of, answer, inference):
#   - Ưu tiên câu cần trí nhớ dài: chuyện chương 1–4 hỏi ở chương 9–10. Chi tiết được nhắc lại ở chương
#     hỏi thì lấy fact_chapter là chương nhắc lại (khoảng cách thật), nên tránh hỏi chuyện truyện lặp mãi
#     (Trần Mặc nhắc lại cuộc đổi chác ở mọi chương 6–10; Lưu Tố Nguyệt cứu người nhắc ở chương 5–10).
#   - Nhân vật chính kể ngôi thứ nhất; tên "Phó Cảnh Hành" chỉ hiện trên trang ở chương 10, người chơi
#     thấy nó ở màn khởi tạo. Câu hỏi viết "Phó Cảnh Hành (nhân vật chính)"; đáp án là nhân vật chính thì
#     nhận cả "nhân vật chính", "người kể", "tôi" (`aliases`).
#   - Nhóm "ai biết gì" gồm cả điều một nhân vật đã nói, đã giấu, hay nhân vật chính đã phát hiện trên
#     trang. Nhóm "lời nói dối" để trống: trang không có lời nói dối nào (chỉ có giấu và né).
#   - KHÔNG hỏi điều chỉ có ở lớp sự thật (Bạch Thiên Sách biết từ đầu, Lưu Tố Nguyệt giữ Đèn Lưu Quang
#     ở chương 0) và chỗ trang tự mâu thuẫn hay mơ hồ: "món đồ gia truyền" so với Thẻ Định Phong (trang
#     tả hai vật, lớp sự thật tả thẻ khắc dấu gia tộc); chương 5 "Không có Thẻ Định Phong" trong lúc
#     đang cầm thẻ; cuối chương 8 "chưa nói hắn có được đi cùng" sau khi đã cho đi sau.

