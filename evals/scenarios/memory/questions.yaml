    evidence: [{chapter: 2, quote: "Lá thư thì anh kẹp vào giữa cuốn gia phả đang chép dở."},
               {chapter: 5, quote: "bên cạnh lá thư niêm sáp đỏ của Lão Gù"}]

  - id: item-08
    group: item
    fact_chapter: 2
    ask_chapter: 5
    question: >-
      Cuối chương 5, Minh đang giữ những đồ vật nào có tên trong truyện?
      (Thanh Sương, lá thư niêm sáp đỏ của Lão Gù, thư của Hội Hắc Kỳ... liệt kê hết những gì Minh giữ.)
    answer:
      type: entities
      gold: [sword, sealed_letter, hac_ky_letter]
      aliases:
        hac_ky_letter: ["xấp thư", "thư của Hội", "thư Hắc Kỳ", "thư buộc dây gai"]
        sealed_letter: ["lá thư của Lão Gù", "thư niêm sáp", "thư của lão"]
    derive: {op: held_by, holder: minh}
    evidence: [{chapter: 2, quote: "Ta giao nó cho mày."},
               {chapter: 5, quote: "Minh bọc Thanh Sương vào áo khoác, nhét lá thư vào ngực áo"},
               {chapter: 5, quote: "bên cạnh lá thư niêm sáp đỏ của Lão Gù"}]

  - id: item-09
    group: item
    fact_chapter: 2
    ask_chapter: 4
    question: "Cuối chương 4, Minh đang giữ những đồ vật nào có tên trong truyện? Liệt kê hết."
