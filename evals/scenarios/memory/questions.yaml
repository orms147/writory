    derive: {op: holders, item: sword}
    evidence: [{chapter: 2, quote: "Lão đặt Thanh Sương vào tay Minh."}]

  - id: item-03
    group: item
    fact_chapter: 2
    ask_chapter: 3
    question: "Cuối chương 3, ai đang giữ thanh kiếm Thanh Sương?"
