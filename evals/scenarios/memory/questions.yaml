# Bài đo A — bộ nhớ: câu hỏi về truyện mẫu 5 chương (data/sample-story/), khai TRƯỚC khi chạy.
# docs/eval.md "Bài A"; D-72.
#
# TRẠNG THÁI: BẢN NHÁP, CHỜ CHỦ DỰ ÁN DUYỆT. Đáp án gốc lấy từ data/sample-story/graph.yaml (dựng
# tay, cũng chờ duyệt). Chưa duyệt thì không chạy thật. Đã chạy thật rồi thì không sửa đè: tăng `version`.
#
# Mỗi câu hỏi "sau khi đã đọc tới hết chương ask_chapter" (hệ trả lời chỉ thấy chương 1..ask_chapter).
#   fact_chapter  chương CŨ NHẤT mà câu trả lời đúng dựa vào. Khoảng cách = ask_chapter - fact_chapter.
#                 Câu hỏi về điều CHƯA xảy ra (đáp án "Không") lấy fact_chapter = ask_chapter.
#   as_of         hỏi về trạng thái ở cuối chương này (mặc định = ask_chapter); câu "hồi đó".
#   answer.type   entities: tập id thực thể (khớp tên và biệt danh của graph.yaml, cộng `aliases`)
#                 bool:     true/false; câu trả lời phải bắt đầu bằng Có/Không
#                 choice:   một trong `options`
#                 text:     `gold` là danh sách nhóm từ khoá; mỗi nhóm phải có ít nhất một từ trong câu trả lời
#   derive        cách tính lại đáp án từ đồ thị tại as_of (test kiểm derive == gold, nên đáp án gốc
#                 không do tay gõ mà phải khớp đồ thị). Thiếu derive là lỗi.
#   evidence      câu trích nguyên văn từ chương: điều người đọc thấy được trên trang. Test kiểm câu trích
#                 có thật và nằm trong chương <= ask_chapter, nên câu hỏi luôn trả lời được từ trang.
#
# KHÔNG hỏi điều chỉ có trong lớp sự thật mà trang chưa nói (Lan là gián điệp từ đầu, Lan giữ thanh
# kiếm ở chương 4, "con mồi", ai giết Lão Gù): hệ đồ thị thấy được, các hệ khác không thể trả lời đúng.

version: 1
status: "BẢN NHÁP, CHỜ CHỦ DỰ ÁN DUYỆT"
story: sample-story

questions:
  # ---------------------------------------------------------------- đồ vật
  - id: item-01
    group: item
    fact_chapter: 1
    ask_chapter: 1
    question: "Cuối chương 1, ai đang giữ thanh kiếm Thanh Sương?"
    answer: {type: entities, gold: [gu]}
    derive: {op: holders, item: sword}
    evidence: [{chapter: 1, quote: "trên đùi đặt một thanh kiếm dài"}]

  - id: item-02
    group: item
    fact_chapter: 2
    ask_chapter: 2
    question: "Cuối chương 2, ai đang giữ thanh kiếm Thanh Sương?"
