[project]
name = "writory"
version = "0.0.0"
description = "WriTory — truyện tương tác tiếng Việt với trí nhớ đồ thị"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "neo4j>=6.4.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
eval = [
    "anthropic>=1.15.0",
]

[tool.uv]
# Bộ đo (nhóm eval) cài cùng dev để test của khung chạy bài đo chạy được trong CI.
# Gói chính không phụ thuộc anthropic (D-24).
default-groups = ["dev", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["graph: cần dịch vụ Docker: Neo4j, và Postgres cho luồng ghi chương (docker compose up -d)"]

[tool.ruff]
line-length = 100
target-version = "py312"
